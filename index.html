    }

    function copyReview() {
      const text = reviewTextCache;
      if (!text) return;
      const done = () => showToast('복기 내용이 복사됐어요');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }

    function fallbackCopy(text, done) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { showToast('복사 실패'); }
      document.body.removeChild(ta);
    }

    // 히트맵/밀린약속에서 해당 날짜 체크리스트로 이동
    function openDate(dateStr) {
      currentDate = new Date(dateStr + 'T00:00:00');
      updateDateDisplay();
      loadChecklist();
      switchTab('checklist', document.querySelectorAll('.tab-btn')[0]);
    }

    // 밀린 약속을 오늘 목록으로 (A급으로 올림 — 등급 지정이 완료율을 올리므로)
    async function pullToToday(idx) {
      const z = stalledCache[idx];
      if (!z) return;

      currentDate = new Date();
      updateDateDisplay();
      await loadChecklist();

      if (checklistItems.some(i => String(i.name).trim() === z.name)) {
        showToast('이미 오늘 목록에 있어요');
      } else {
        const maxOrder = checklistItems.reduce((max, i) => Math.max(max, i.order || 0), 0);
        checklistItems.push({
          name: z.name, done: false, type: '추가', order: maxOrder + 1,
          id: 'a' + Date.now(), deadline: null, priority: 'A'
        });
        renderChecklist();
        await saveChecklist();
        statsLong = null;   // 데이터 바뀌었으니 캐시 무효화
        showToast(`'${z.name}' 오늘 목록에 A급으로 추가됨`);
      }
      switchTab('checklist', document.querySelectorAll('.tab-btn')[0]);
    }

    // 새록 복기 섹션 렌더링 (진단 + 처방 + 한 문장 + 복사)
    function renderReviewSection(s, lev, stalled, streak, prevRate) {
      const diagnosis = buildDiagnosis(s, lev, stalled, streak, prevRate);
      const rx = buildPrescriptions(s, lev, stalled, streak);
      const quote = pickQuote(s.total > 0 ? s.rate : 0);
      const label = document.getElementById('statsPeriodLabel').textContent;
      reviewTextCache = buildReviewText(label, diagnosis, rx, quote);

      return `
        <div class="stats-section review-section">
          <h3>&#128172; 새록 복기 <span class="sub-note">${statsMode === 'week' ? '주간' : '월간'} 진단 &amp; 처방</span></h3>
          ${diagnosis.map(([ico, msg]) => `
            <div class="review-line"><span class="ico">${ico}</span><span>${msg}</span></div>`).join('')}

          <div class="review-sub">이번 ${statsMode === 'week' ? '주' : '달'} 처방</div>
          ${rx.map((t, i) => `
            <div class="rx-item"><span class="rx-no">${i + 1}</span><span>${t}</span></div>`).join('')}

          <div class="review-quote">${quote}</div>
          <button class="copy-review-btn" onclick="copyReview()">&#128203; 복기 내용 복사 (노트봇/메모에 붙여넣기)</button>
        </div>`;
    }

    function renderStats(dates, days, days90) {
      const s = analyzeStats(dates, days);
      const body = document.getElementById('statsBody');

      const lev = analyzeLevers(days90 || {});
      const stalled = findStalled(days90 || {});
      const streak = computeStreak(days90 || {});
      const prevRate = prevPeriodRate(dates, days90 || {});
      stalledCache = stalled;

      // 1) 요약 카드 (달성률 + 직전 기간 대비)
      const rateClass = s.rate >= 70 ? 'good' : s.rate < 40 ? 'bad' : '';
      let deltaHtml = '<div class="delta flat">비교 없음</div>';
      if (prevRate !== null) {
        const d = s.rate - prevRate;
        deltaHtml = `<div class="delta ${d > 0 ? 'up' : d < 0 ? 'down' : 'flat'}">${d > 0 ? '&#9650;' : d < 0 ? '&#9660;' : ''} ${Math.abs(d)}%p</div>`;
      }
      const pastDays = s.daily.filter(x => !x.isFuture).length;

      let html = `
        <div class="stat-cards" style="grid-template-columns:repeat(4,1fr);">
          <div class="stat-card"><div class="num ${rateClass}" style="font-size:19px;">${s.rate}%</div><div class="lbl">달성률</div>${deltaHtml}</div>
          <div class="stat-card"><div class="num good" style="font-size:19px;">${s.done}</div><div class="lbl">완료</div><div class="delta flat">${s.total}개 중</div></div>
          <div class="stat-card"><div class="num bad" style="font-size:19px;">${s.total - s.done}</div><div class="lbl">미완료</div><div class="delta flat">완주 ${s.perfectDays}일</div></div>
          <div class="stat-card"><div class="num" style="font-size:19px;">${s.activeDays}<span style="font-size:12px;color:var(--text-light);">/${pastDays}</span></div><div class="lbl">기록일</div><div class="delta ${s.activeDays === pastDays && pastDays > 0 ? 'up' : 'down'}">공백 ${Math.max(pastDays - s.activeDays, 0)}일</div></div>
        </div>`;

      // 2) 기록 히트맵 (클릭 시 해당 날짜로 이동) + 스트릭
      const todayStr = formatDate(new Date());
      const dowHead = ['일', '월', '화', '수', '목', '금', '토'];
      const firstDow = new Date(dates[0] + 'T00:00:00').getDay();
      const leading = statsMode === 'month' ? firstDow : 0;

      const cells = [];
      for (let i = 0; i < leading; i++) cells.push('<div class="heat-cell empty-day"></div>');
      s.daily.forEach(x => {
        const d = new Date(x.date + 'T00:00:00');
        let cls = 'no-record';
        if (x.t > 0) {
          const r = x.d / x.t;
          cls = r >= 1 ? 'lv4' : r >= 0.7 ? 'lv3' : r >= 0.4 ? 'lv2' : 'lv1';
        }
        if (x.isFuture) cls += ' future';
        if (x.date === todayStr) cls += ' today-cell';
        const sub = x.t > 0 ? `${x.d}/${x.t}` : '&#183;';
        cells.push(`<div class="heat-cell ${cls}" onclick="openDate('${x.date}')" title="${x.date}">
                      <div class="hc-day">${d.getDate()}</div><div class="hc-sub">${sub}</div>
                    </div>`);
      });

      html += `
        <div class="stats-section">
          <h3>&#128197; 기록 히트맵 <span class="sub-note">칸을 누르면 그날 체크리스트로</span></h3>
          <div class="heatmap">
            ${dowHead.map(h => `<div class="heat-head">${h}</div>`).join('')}
            ${cells.join('')}
          </div>
          <div class="heat-legend">
            <span>기록없음</span><span class="box" style="background:var(--bg);border:1px dashed var(--border);"></span>
            <span class="box lv1" style="background:#D5F0E3;"></span>
            <span class="box lv2" style="background:#9FE0BE;"></span>
            <span class="box lv3" style="background:#58C98F;"></span>
            <span class="box lv4" style="background:var(--success);"></span><span>완주</span>
          </div>
          <div class="streak-row">
            <div class="streak-box"><div class="sv">${streak.current}일</div><div class="sl">현재 연속 기록</div></div>
            <div class="streak-box"><div class="sv">${streak.best}일</div><div class="sl">최장 기록</div></div>
            <div class="streak-box"><div class="sv">${streak.rate}%</div><div class="sl">90일 기록률</div></div>
          </div>
        </div>`;

      // 3) 실행 레버 — 무엇이 내 완료율을 바꾸는가 (최근 90일)
      if (lev.levers.length > 0) {
        html += `
          <div class="stats-section">
            <h3>&#128295; 실행 레버 <span class="sub-note">최근 90일 ${lev.n}개 항목 기준</span></h3>
            <div style="font-size:12px;color:var(--text-light);margin-bottom:6px;">같은 나인데 조건에 따라 완료율이 이만큼 달라집니다.</div>
            ${lev.levers.map(l => `
              <div class="lever">
                <div class="lever-head">
                  <span class="lever-name">${l.name}</span>
                  <span class="lever-delta ${l.delta >= 0 ? 'up' : 'down'}">+${l.delta}%p</span>
                </div>
                <div class="lever-bar">
                  <span class="lb-lbl">${l.onLbl}</span>
                  <div class="lb-track"><div class="lb-fill on" style="width:${l.onRate}%"></div></div>
                  <span class="lb-val">${l.onRate}%</span>
                </div>
                <div class="lever-bar">
                  <span class="lb-lbl">${l.offLbl}</span>
                  <div class="lb-track"><div class="lb-fill" style="width:${l.offRate}%"></div></div>
                  <span class="lb-val">${l.offRate}%</span>
                </div>
                <div class="lever-note">${l.note} &middot; 표본 ${l.on.t + l.off.t}개</div>
              </div>`).join('')}
          </div>`;
      }

      // 4) 밀린 약속 (여러 번 적고 못 끝낸 항목)
      if (stalled.length > 0) {
        html += `
          <div class="stats-section">
            <h3>&#9203; 밀린 약속 <span class="sub-note">최근 90일 · 끌고 다니는 항목</span></h3>
            ${stalled.map((z, i) => `
              <div class="stalled-item">
                <div class="st-body">
                  <div class="st-name">${escapeHtml(z.name)}</div>
                  <div class="st-meta"><span class="st-days">${z.ageDays}일째</span> &middot; ${z.misses}번 적고 못 끝냄 &middot; 마지막 시도 ${z.last}</div>
                </div>
                <button class="pull-btn" onclick="pullToToday(${i})">오늘로</button>
              </div>`).join('')}
            <div class="lever-note" style="margin-top:8px;">오늘로 가져오면 A급으로 올라갑니다. 할 생각이 없는 항목은 지우는 게 낫습니다.</div>
          </div>`;
      }

      if (s.total === 0) {
        html += `
          <div class="stats-section">
            <div class="empty-state" style="padding:24px 12px;">
              <div class="empty-icon">&#128202;</div>
              <p>이 기간엔 기록된 항목이 없어요</p>
              <p style="margin-top:4px;font-size:12px;">위 히트맵에서 다른 기간을 눌러보거나 체크리스트를 작성해보세요</p>
            </div>
          </div>`;
        html += renderReviewSection(s, lev, stalled, streak, prevRate);
        body.innerHTML = html;
        return;
      }

      // 5) 우선순위별
      const prioRows = [['A', 'A급 (중요)'], ['B', 'B급'], ['C', 'C급'], ['N', '미지정']]
        .filter(([k]) => s.byPrio[k].t > 0)
        .map(([k, name]) => {
          const p = s.byPrio[k];
          const r = Math.round(p.d / p.t * 100);
          return `<div class="bar-row">
                    <span class="bar-name"><span class="prio-tag ${k}">${k === 'N' ? '-' : k}</span></span>
                    <div class="bar-track"><div class="bar-fill" style="width:${r}%"></div></div>
                    <span class="bar-val">${p.d}/${p.t} (${r}%)</span>
                  </div>`;
        }).join('');
      html += `
        <div class="stats-section">
          <h3>&#127919; 우선순위별 분석</h3>
          ${prioRows}
        </div>`;

      // 6) 업무 거래처 (병원/약국)
      if (s.workItems.length > 0) {
        const wRate = Math.round(s.workDone / s.workItems.length * 100);
        html += `
          <div class="stats-section">
            <h3>&#127973; 업무 거래처 활동 <span class="sub-note">${s.workDone}/${s.workItems.length}건 완료 (${wRate}%)</span></h3>
            ${s.topPlaces.map(([name, v], i) => `
              <div class="rank-item">
                <span class="rank-no">${i + 1}</span>
                <span class="rank-name">${escapeHtml(name)}</span>
                <span class="rank-cnt"><b>${v.d}</b>/${v.t}회</span>
              </div>`).join('')}
          </div>`;
      }

      // 7) 자주 놓친 항목
      if (s.topMissed.length > 0) {
        html += `
          <div class="stats-section">
            <h3>&#128683; 자주 놓친 항목</h3>
            ${s.topMissed.map(([name, cnt], i) => `
              <div class="rank-item">
                <span class="rank-no">${i + 1}</span>
                <span class="rank-name">${escapeHtml(name)}</span>
                <span class="rank-cnt"><b>${cnt}</b>회 미완료</span>
              </div>`).join('')}
          </div>`;
      }

      // 8) 많이 완료한 항목
      if (s.topDone.length > 0) {
        html += `
          <div class="stats-section">
            <h3>&#9989; 꾸준히 완료한 항목</h3>
            ${s.topDone.map(([name, cnt], i) => `
              <div class="rank-item">
                <span class="rank-no">${i + 1}</span>
                <span class="rank-name">${escapeHtml(name)}</span>
                <span class="rank-cnt"><b>${cnt}</b>회 완료</span>
              </div>`).join('')}
          </div>`;
      }

      // 9) 생활 영역 분석
      if (s.catList.length > 0) {
        html += `
          <div class="stats-section">
            <h3>&#129517; 생활 영역 분석 <span class="sub-note">항목명 기반 자동 분류</span></h3>
            ${s.catList.map(([name, v]) => {
              const r = Math.round(v.d / v.t * 100);
              return `<div class="bar-row">
                        <span class="bar-name">${escapeHtml(name)}</span>
                        <div class="bar-track"><div class="bar-fill" style="width:${r}%"></div></div>
                        <span class="bar-val">${v.d}/${v.t} (${r}%)</span>
                      </div>`;
            }).join('')}
          </div>`;
      }

      // 10) 새록 복기 (진단 + 처방)
      html += renderReviewSection(s, lev, stalled, streak, prevRate);

      body.innerHTML = html;
    }

    // ==========================================
    // Settings - API Connection
    // ==========================================
    function saveApiUrl() {
      const url = document.getElementById('apiUrlInput').value.trim();
      if (url) {
        localStorage.setItem(API_URL_KEY, url);
        showToast('URL 저장됨');
        updateConnectionStatus();
      } else {
        localStorage.removeItem(API_URL_KEY);
        showToast('URL 제거됨');
        updateConnectionStatus();
      }
    }

    async function testConnection() {
      const url = getApiUrl();
      if (!url) {
        showToast('URL을 먼저 입력하세요');
        return;
      }

      showLoading(true);
      const data = await apiGet('ping');
      showLoading(false);

      if (data && !data.error) {
        showToast('연결 성공!');
        updateConnectionStatus(true);
      } else {
        showToast('연결 실패 - URL을 확인하세요');
        updateConnectionStatus(false);
      }
    }

    function updateConnectionStatus(connected) {
      const badge = document.getElementById('connectionStatus');
      const hasUrl = !!getApiUrl();

      if (connected === true) {
        badge.textContent = '연결됨';
        badge.className = 'status-badge connected';
      } else if (connected === false || !hasUrl) {
        badge.textContent = hasUrl ? '연결 실패' : '미연결';
        badge.className = 'status-badge disconnected';
      }
    }

    // ==========================================
    // Toast
    // ==========================================
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
