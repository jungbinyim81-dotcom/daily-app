<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4A90D9">
  <title>일일 체크리스트</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root {
      --primary: #4A90D9;
      --primary-light: #6BA5E7;
      --primary-dark: #3A7BC8;
      --bg: #F5F7FA;
      --card: #FFFFFF;
      --text: #2C3E50;
      --text-light: #7F8C8D;
      --success: #27AE60;
      --danger: #E74C3C;
      --border: #E8ECF1;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --radius: 12px;
      --tab-height: 60px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 16px 20px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(74,144,217,0.3);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .header .date-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
    }

    .header .date-nav button {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header .date-nav button:active {
      background: rgba(255,255,255,0.35);
    }

    .header .date-nav .current-date {
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
    }

    /* Loading overlay */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .loading-overlay.active {
      display: flex;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Tab content */
    .tab-content {
      padding: 16px 16px calc(var(--tab-height) + var(--safe-bottom) + 16px);
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Bottom Tab Bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--tab-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--card);
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
      z-index: 100;
    }

    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 0;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-light);
      font-size: 11px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .tab-btn.active {
      color: var(--primary);
    }

    .tab-btn .tab-icon {
      font-size: 22px;
      line-height: 1;
    }

    /* Progress Bar */
    .progress-container {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .progress-info .label {
      font-size: 14px;
      font-weight: 600;
    }

    .progress-info .count {
      font-size: 13px;
      color: var(--text-light);
    }

    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      border-radius: 4px;
      transition: width 0.4s ease;
      width: 0%;
    }

    /* Monthly Plan Section */
    .monthly-plan-section {
      background: var(--card);
      border-radius: var(--radius);
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .monthly-plan-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
    }

    .monthly-plan-header:active {
      background: var(--bg);
    }

    .monthly-plan-header .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .monthly-plan-header .title {
      font-size: 14px;
      font-weight: 700;
    }

    .monthly-progress {
      font-size: 12px;
      background: var(--bg);
      color: var(--text-light);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .monthly-toggle {
      font-size: 12px;
      color: var(--text-light);
      transition: transform 0.2s;
    }

    .monthly-toggle.open {
      transform: rotate(180deg);
    }

    .monthly-plan-body {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
    }

    .monthly-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .monthly-item:last-of-type {
      border-bottom: none;
    }

    .monthly-item .checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .monthly-item.done .checkbox {
      background: var(--success);
      border-color: var(--success);
    }

    .monthly-item .checkbox::after {
      content: '';
      display: none;
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-top: -2px;
    }

    .monthly-item.done .checkbox::after {
      display: block;
    }

    .monthly-item .monthly-name {
      flex: 1;
      font-size: 14px;
    }

    .monthly-item.done .monthly-name {
      text-decoration: line-through;
      color: var(--text-light);
    }

    .monthly-item .delete-btn {
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      opacity: 0.5;
    }

    .monthly-item .delete-btn:active {
      opacity: 1;
      color: var(--danger);
    }

    .monthly-add-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .monthly-add-row input {
      flex: 1;
      padding: 8px 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .monthly-add-row input:focus {
      border-color: var(--primary);
    }

    .monthly-add-row button {
      padding: 8px 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Checklist */
    .checklist-section {
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      padding-left: 4px;
    }

    .checklist-item {
      background: var(--card);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow);
      transition: all 0.2s;
    }

    .checklist-item.done {
      opacity: 0.6;
    }

    .checklist-item .checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .checklist-item.done .checkbox {
      background: var(--success);
      border-color: var(--success);
    }

    .checklist-item .checkbox::after {
      content: '';
      display: none;
      width: 6px;
      height: 10px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-top: -2px;
    }

    .checklist-item.done .checkbox::after {
      display: block;
    }

    /* Priority Badge */
    .priority-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }

    .priority-badge.A { background: #E74C3C; }
    .priority-badge.B { background: #E67E22; }
    .priority-badge.C { background: #3498DB; }

    /* Item content */
    .item-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .checklist-item .item-name {
      font-size: 15px;
      font-weight: 500;
    }

    .checklist-item.done .item-name {
      text-decoration: line-through;
      color: var(--text-light);
    }

    .deadline-text {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 2px;
    }

    .deadline-text.overdue {
      color: var(--danger);
      font-weight: 600;
    }

    .checklist-item .delete-btn {
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      opacity: 0.5;
    }

    .checklist-item .delete-btn:active {
      opacity: 1;
      color: var(--danger);
    }

    .checklist-item .edit-btn {
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 15px;
      cursor: pointer;
      padding: 4px;
      opacity: 0.5;
    }

    .checklist-item .edit-btn:active {
      opacity: 1;
      color: var(--primary);
    }

    /* 항목 수정 모드 (인라인 편집 폼) */
    .checklist-item.editing {
      display: block;
      border: 2px solid var(--primary);
      padding: 12px;
    }

    .edit-form .edit-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .edit-form .edit-row + .edit-row {
      margin-top: 8px;
    }

    .edit-form .edit-name {
      flex: 1;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: var(--bg);
      min-width: 0;
    }

    .edit-form .edit-name:focus {
      border-color: var(--primary);
      background: var(--card);
    }

    .edit-form input[type="time"] {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: var(--bg);
    }

    .edit-form .edit-actions {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .edit-form .save-btn,
    .edit-form .cancel-btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      border: none;
    }

    .edit-form .save-btn {
      background: var(--primary);
      color: white;
    }

    .edit-form .cancel-btn {
      background: none;
      border: 2px solid var(--border);
      color: var(--text-light);
    }

    /* Add Item (new multi-row UI) */
    .add-item-wrapper {
      margin-top: 16px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .add-item-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .add-item-row + .add-item-row {
      margin-top: 8px;
    }

    .add-item-row .text-input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      outline: none;
      background: var(--bg);
    }

    .add-item-row .text-input:focus {
      border-color: var(--primary);
      background: var(--card);
    }

    .time-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .time-group input[type="time"] {
      flex: 1;
      padding: 8px 10px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: var(--bg);
    }

    .time-group input[type="time"]:focus {
      border-color: var(--primary);
      background: var(--card);
    }

    .time-group .until-label {
      font-size: 13px;
      color: var(--text-light);
      white-space: nowrap;
    }

    .priority-group {
      display: flex;
      gap: 4px;
    }

    .priority-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-light);
      transition: all 0.15s;
    }

    .priority-btn[data-priority="A"].active { background: #E74C3C; border-color: #E74C3C; color: white; }
    .priority-btn[data-priority="B"].active { background: #E67E22; border-color: #E67E22; color: white; }
    .priority-btn[data-priority="C"].active { background: #3498DB; border-color: #3498DB; color: white; }

    .add-btn {
      padding: 8px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .add-btn:active {
      background: var(--primary-dark);
    }

    /* Stats Tab */
    .stats-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .period-toggle {
      display: flex;
      background: var(--card);
      border-radius: 10px;
      padding: 3px;
      box-shadow: var(--shadow);
    }

    .period-toggle button {
      border: none;
      background: none;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-light);
      cursor: pointer;
    }

    .period-toggle button.active {
      background: var(--primary);
      color: white;
    }

    .period-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border-radius: 10px;
      padding: 3px 6px;
      box-shadow: var(--shadow);
    }

    .period-nav button {
      border: none;
      background: none;
      font-size: 13px;
      padding: 6px 8px;
      color: var(--primary);
      cursor: pointer;
    }

    .period-nav .period-label {
      font-size: 13px;
      font-weight: 600;
      min-width: 96px;
      text-align: center;
    }

    .stat-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px 8px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-card .num {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }

    .stat-card .num.good { color: var(--success); }
    .stat-card .num.bad { color: var(--danger); }

    .stat-card .lbl {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 4px;
      font-weight: 600;
    }

    .stats-section {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .stats-section h3 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stats-section .sub-note {
      font-size: 11px;
      color: var(--text-light);
      font-weight: 400;
      margin-left: auto;
    }

    /* 우선순위/카테고리 가로 바 */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .bar-row .bar-name {
      width: 74px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-row .bar-track {
      flex: 1;
      height: 16px;
      background: var(--bg);
      border-radius: 8px;
      overflow: hidden;
    }

    .bar-row .bar-fill {
      height: 100%;
      border-radius: 8px;
      background: var(--primary);
      transition: width 0.4s ease;
    }

    .bar-row .bar-val {
      width: 78px;
      font-size: 11px;
      color: var(--text-light);
      text-align: right;
      flex-shrink: 0;
    }

    .prio-tag {
      display: inline-flex;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 11px;
      font-weight: 700;
      margin-right: 6px;
    }

    .prio-tag.A { background: var(--danger); }
    .prio-tag.B { background: #F39C12; }
    .prio-tag.C { background: var(--primary); }
    .prio-tag.N { background: #95A5A6; }

    /* 일별 추이 세로 바 차트 */
    .day-chart {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 90px;
      padding-top: 14px;
    }

    .day-chart .day-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      min-width: 0;
    }

    .day-chart .day-bar {
      width: 100%;
      max-width: 26px;
      border-radius: 4px 4px 0 0;
      background: var(--primary-light);
      min-height: 2px;
      position: relative;
    }

    .day-chart .day-bar.full { background: var(--success); }
    .day-chart .day-bar.zero { background: var(--border); }

    .day-chart .day-lbl {
      font-size: 9px;
      color: var(--text-light);
      margin-top: 4px;
      white-space: nowrap;
    }

    .day-chart .day-col.today-col .day-lbl {
      color: var(--primary);
      font-weight: 700;
    }

    /* 항목 리스트 (놓친/완료 TOP) */
    .rank-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .rank-item:last-child { border-bottom: none; }

    .rank-item .rank-no {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--bg);
      color: var(--text-light);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .rank-item .rank-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rank-item .rank-cnt {
      font-size: 12px;
      color: var(--text-light);
      flex-shrink: 0;
    }

    .rank-item .rank-cnt b { color: var(--text); }

    /* 인사이트 */
    .insight-item {
      display: flex;
      gap: 8px;
      padding: 8px 0;
      font-size: 13px;
      line-height: 1.55;
      border-bottom: 1px dashed var(--border);
    }

    .insight-item:last-child { border-bottom: none; }

    .insight-item .ico { flex-shrink: 0; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light);
    }

    .empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 14px;
    }

    /* ===== v4 통계: 요약 델타 ===== */
    .stat-card .delta {
      font-size: 10px;
      font-weight: 700;
      margin-top: 2px;
    }
    .stat-card .delta.up { color: var(--success); }
    .stat-card .delta.down { color: var(--danger); }
    .stat-card .delta.flat { color: var(--text-light); }

    /* ===== 기록 히트맵 ===== */
    .heatmap {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .heat-head {
      font-size: 10px;
      color: var(--text-light);
      text-align: center;
      font-weight: 700;
      padding-bottom: 2px;
    }

    .heat-cell {
      aspect-ratio: 1;
      border-radius: 6px;
      background: var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-light);
      cursor: pointer;
      border: 2px solid transparent;
      overflow: hidden;
    }

    .heat-cell.empty-day { background: transparent; cursor: default; }
    .heat-cell.no-record { background: var(--bg); border: 1px dashed var(--border); }
    .heat-cell.lv1 { background: #D5F0E3; color: #1F7A4D; }
    .heat-cell.lv2 { background: #9FE0BE; color: #14603A; }
    .heat-cell.lv3 { background: #58C98F; color: #0C4527; }
    .heat-cell.lv4 { background: var(--success); color: #fff; }
    .heat-cell.future { opacity: 0.4; }
    .heat-cell.today-cell { border-color: var(--primary); }
    .heat-cell .hc-day { font-size: 11px; line-height: 1.1; }
    .heat-cell .hc-sub { font-size: 9px; opacity: 0.85; line-height: 1.1; }

    .heat-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: flex-end;
      margin-top: 8px;
      font-size: 10px;
      color: var(--text-light);
    }

    .heat-legend .box {
      width: 12px; height: 12px; border-radius: 3px; display: inline-block;
    }

    .streak-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .streak-box {
      flex: 1;
      background: var(--bg);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    .streak-box .sv { font-size: 16px; font-weight: 800; color: var(--primary); }
    .streak-box .sl { font-size: 10px; color: var(--text-light); font-weight: 600; margin-top: 2px; }

    /* ===== 실행 레버 ===== */
    .lever {
      padding: 10px 0;
      border-bottom: 1px dashed var(--border);
    }
    .lever:last-child { border-bottom: none; }

    .lever-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .lever-name { font-size: 13px; font-weight: 700; }

    .lever-delta {
      margin-left: auto;
      font-size: 12px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .lever-delta.up { background: rgba(46,204,113,0.15); color: var(--success); }
    .lever-delta.down { background: rgba(231,76,60,0.12); color: var(--danger); }

    .lever-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .lever-bar .lb-lbl {
      font-size: 11px;
      color: var(--text-light);
      width: 78px;
      flex-shrink: 0;
      text-align: right;
    }

    .lever-bar .lb-track {
      flex: 1;
      height: 10px;
      background: var(--bg);
      border-radius: 5px;
      overflow: hidden;
    }

    .lever-bar .lb-fill { height: 100%; background: var(--border); border-radius: 5px; }
    .lever-bar .lb-fill.on { background: var(--success); }
    .lever-bar .lb-val { font-size: 11px; font-weight: 700; width: 34px; text-align: right; }

    .lever-note { font-size: 11px; color: var(--text-light); margin-top: 6px; }

    /* ===== 밀린 약속 ===== */
    .stalled-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 0;
      border-bottom: 1px dashed var(--border);
    }
    .stalled-item:last-child { border-bottom: none; }

    .stalled-item .st-body { flex: 1; min-width: 0; }
    .stalled-item .st-name { font-size: 13px; font-weight: 600; }
    .stalled-item .st-meta { font-size: 11px; color: var(--text-light); margin-top: 2px; }
    .stalled-item .st-days { color: var(--danger); font-weight: 700; }

    .pull-btn {
      flex-shrink: 0;
      padding: 6px 10px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .pull-btn:active { background: var(--primary-dark); }

    /* ===== 새록 복기 ===== */
    .review-section {
      background: linear-gradient(160deg, #2C3E50 0%, #1A2530 100%);
      color: #ECF0F1;
    }
    .review-section h3 { color: #fff; }
    .review-section .sub-note { color: rgba(255,255,255,0.55); }

    .review-line {
      display: flex;
      gap: 8px;
      padding: 7px 0;
      font-size: 13px;
      line-height: 1.6;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .review-line:last-child { border-bottom: none; }
    .review-line b { color: #FFD479; }
    .review-line .ico { flex-shrink: 0; }

    .review-sub {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: rgba(255,255,255,0.5);
      margin: 14px 0 4px;
    }

    .rx-item {
      display: flex;
      gap: 8px;
      padding: 7px 0;
      font-size: 13px;
      line-height: 1.55;
    }

    .rx-no {
      flex-shrink: 0;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #FFD479;
      color: #1A2530;
      font-size: 11px;
      font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1px;
    }

    .review-quote {
      margin-top: 12px;
      padding: 10px 12px;
      border-left: 3px solid #FFD479;
      background: rgba(255,255,255,0.05);
      font-size: 12.5px;
      line-height: 1.6;
      font-style: italic;
      color: rgba(255,255,255,0.85);
    }

    .copy-review-btn {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .copy-review-btn:active { background: rgba(255,255,255,0.18); }

    /* Settings Tab */
    .settings-section {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .settings-section h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .api-url-input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      margin-top: 8px;
    }

    .api-url-input:focus {
      border-color: var(--primary);
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:active {
      background: var(--primary-dark);
    }

    .btn-outline {
      background: none;
      border: 2px solid var(--border);
      color: var(--text);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 13px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-badge.connected {
      background: #E8F8EF;
      color: var(--success);
    }

    .status-badge.disconnected {
      background: #FDE8E8;
      color: var(--danger);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: calc(var(--tab-height) + var(--safe-bottom) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text);
      color: white;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      z-index: 200;
      opacity: 0;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1 id="headerTitle">오늘의 체크리스트</h1>
    <div class="date-nav" id="dateNav">
      <button onclick="changeDate(-1)">&#9664;</button>
      <span class="current-date" id="currentDate" onclick="goToday()"></span>
      <button onclick="changeDate(1)">&#9654;</button>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
  </div>

  <!-- Tab 1: Checklist -->
  <div class="tab-content active" id="tab-checklist">
    <!-- Progress -->
    <div class="progress-container">
      <div class="progress-info">
        <span class="label">오늘의 달성률</span>
        <span class="count" id="progressCount">0/0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Monthly Plan -->
    <div class="monthly-plan-section">
      <div class="monthly-plan-header" onclick="toggleMonthlySection()">
        <div class="header-left">
          <span class="title">월 계획</span>
          <span class="monthly-progress" id="monthlyProgress">0/0</span>
        </div>
        <span class="monthly-toggle" id="monthlyToggle">&#9660;</span>
      </div>
      <div class="monthly-plan-body" id="monthlyPlanBody" style="display:none;">
        <div id="monthlyItems"></div>
        <div class="monthly-add-row">
          <input type="text" id="newMonthlyItemInput" placeholder="월 계획 항목 추가..."
                 onkeydown="if(event.key==='Enter')addMonthlyItem()">
          <button onclick="addMonthlyItem()">추가</button>
        </div>
      </div>
    </div>

    <!-- Additional items -->
    <div class="checklist-section">
      <div class="section-title">체크리스트</div>
      <div id="additionalItems"></div>
    </div>

    <!-- Add new (multi-row UI) -->
    <div class="add-item-wrapper">
      <div class="add-item-row">
        <input type="text" class="text-input" id="newItemInput" placeholder="새 항목 추가 (예: 오전10시 지유병원)"
               onkeydown="if(event.key==='Enter')addItem()">
      </div>
      <div class="add-item-row">
        <div class="time-group">
          <input type="time" id="newItemDeadline">
          <span class="until-label">까지</span>
        </div>
        <div class="priority-group">
          <button class="priority-btn" data-priority="A" onclick="togglePriority('A')">A</button>
          <button class="priority-btn" data-priority="B" onclick="togglePriority('B')">B</button>
          <button class="priority-btn" data-priority="C" onclick="togglePriority('C')">C</button>
        </div>
        <button class="add-btn" onclick="addItem()">추가</button>
      </div>
    </div>
  </div>

  <!-- Tab 2: Stats -->
  <div class="tab-content" id="tab-stats">
    <!-- 기간 선택 -->
    <div class="stats-toolbar">
      <div class="period-toggle">
        <button id="modeWeek" class="active" onclick="setStatsMode('week')">주간</button>
        <button id="modeMonth" onclick="setStatsMode('month')">월간</button>
      </div>
      <div class="period-nav">
        <button onclick="moveStatsPeriod(-1)">&#9664;</button>
        <span class="period-label" id="statsPeriodLabel"></span>
        <button onclick="moveStatsPeriod(1)">&#9654;</button>
      </div>
    </div>

    <div id="statsBody"></div>
  </div>

  <!-- Tab 3: Settings -->
  <div class="tab-content" id="tab-settings">
    <!-- API URL -->
    <div class="settings-section">
      <h3>Google Apps Script 연결</h3>
      <p style="font-size:13px;color:var(--text-light);margin-bottom:8px;">
        배포된 웹앱 URL을 입력하세요
      </p>
      <input type="url" class="api-url-input" id="apiUrlInput"
             placeholder="https://script.google.com/macros/s/...">
      <div style="display:flex;gap:8px;margin-top:12px;align-items:center;">
        <button class="btn btn-primary btn-sm" onclick="saveApiUrl()">저장</button>
        <button class="btn btn-outline btn-sm" onclick="testConnection()">연결 테스트</button>
        <span class="status-badge disconnected" id="connectionStatus">미연결</span>
      </div>
    </div>

    <!-- App Info -->
    <div class="settings-section" style="text-align:center;">
      <p style="font-size:13px;color:var(--text-light);">일일 체크리스트 v4.0 (실행 레버 분석 + 새록 복기)</p>
      <p style="font-size:12px;color:var(--text-light);margin-top:4px;">PWA - 오프라인 지원</p>
    </div>
  </div>

  <!-- Tab Bar -->
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('checklist', this)">
      <span class="tab-icon">&#9745;</span>
      <span>체크리스트</span>
    </button>
    <button class="tab-btn" onclick="switchTab('stats', this)">
      <span class="tab-icon">&#128202;</span>
      <span>통계</span>
    </button>
    <button class="tab-btn" onclick="switchTab('settings', this)">
      <span class="tab-icon">&#9881;</span>
      <span>설정</span>
    </button>
  </nav>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ==========================================
    // State
    // ==========================================
    let currentDate = new Date();
    let checklistItems = [];
    let monthlyPlanItems = [];
    let selectedPriority = null;
    let editingId = null;            // 수정 중인 항목 ID (null이면 수정 모드 아님)
    let editPriority = null;         // 수정 모드에서 선택된 우선순위
    let statsMode = 'week';          // 'week' | 'month'
    let statsAnchor = new Date();    // 통계 기간 기준일
    let statsLong = null;            // 최근 90일 데이터 캐시 (레버/밀린약속/스트릭용)
    let stalledCache = [];           // 밀린 약속 목록 (버튼에서 인덱스로 참조)
    let reviewTextCache = '';        // 복기 텍스트 (복사용)

    const API_URL_KEY = 'daily_app_api_url';
    const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbz5oYnYCxLW_8sYMumq8_9JUKufIKeCOmKNgFII8RMuX3WOCYoNTh07-U4UeT8bwfoo-g/exec';
    const LOCAL_DATA_PREFIX = 'daily_checklist_';
    const MONTHLY_PLAN_PREFIX = 'monthly_plan_';

    // ==========================================
    // Initialization
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      // 항상 최신 URL로 강제 업데이트
      localStorage.setItem(API_URL_KEY, DEFAULT_API_URL);
      document.getElementById('apiUrlInput').value = DEFAULT_API_URL;

      updateDateDisplay();
      loadChecklist();
      loadMonthlyPlan();
      registerServiceWorker();
    });

    function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    }

    // ==========================================
    // Tab Navigation
    // ==========================================
    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById('tab-' + tab).classList.add('active');
      btn.classList.add('active');

      if (tab === 'checklist') {
        document.getElementById('headerTitle').textContent = '오늘의 체크리스트';
        document.getElementById('dateNav').style.display = 'flex';
      } else if (tab === 'stats') {
        document.getElementById('headerTitle').textContent = '통계 분석';
        document.getElementById('dateNav').style.display = 'none';
        loadStats();
      } else {
        document.getElementById('headerTitle').textContent = '설정';
        document.getElementById('dateNav').style.display = 'none';
        updateConnectionStatus();
      }
    }

    // ==========================================
    // Date Navigation
    // ==========================================
    function formatDate(d) {
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function formatDisplayDate(d) {
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const m = d.getMonth() + 1;
      const day = d.getDate();
      const dow = days[d.getDay()];
      return `${m}월 ${day}일 (${dow})`;
    }

    function getYearMonth() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }

    function updateDateDisplay() {
      const today = new Date();
      const dateStr = formatDisplayDate(currentDate);
      const isToday = formatDate(currentDate) === formatDate(today);
      document.getElementById('currentDate').textContent = isToday ? `오늘 - ${dateStr}` : dateStr;
    }

    function changeDate(delta) {
      currentDate.setDate(currentDate.getDate() + delta);
      updateDateDisplay();
      loadChecklist();
    }

    function goToday() {
      currentDate = new Date();
      updateDateDisplay();
      loadChecklist();
    }

    // ==========================================
    // API Helpers
    // ==========================================
    function getApiUrl() {
      return localStorage.getItem(API_URL_KEY) || '';
    }

    async function apiGet(action, params = {}) {
      const url = getApiUrl();
      if (!url) return null;

      // items 배열은 JSON 문자열로 변환
      const flatParams = {};
      for (const [k, v] of Object.entries({ action, ...params })) {
        flatParams[k] = typeof v === 'object' ? JSON.stringify(v) : v;
      }
      const queryStr = new URLSearchParams(flatParams).toString();
      try {
        const resp = await fetch(`${url}?${queryStr}`, { redirect: 'follow' });
        return await resp.json();
      } catch (e) {
        console.error('API GET error:', e);
        return null;
      }
    }

    async function apiPost(data) {
      // GET 방식으로 저장 (POST CORS 문제 우회)
      return await apiGet(data.action, data);
    }

    // ID 기준 중복 제거 (서버 경합으로 두 벌 저장된 항목 방어, 뒤쪽 = 최신이 이김)
    function dedupeById(items) {
      const map = {};
      const order = [];
      (items || []).forEach(it => {
        const key = it.id || (it.name + '|' + (it.deadline || ''));
        if (!(key in map)) order.push(key);
        map[key] = it;
      });
      return order.map(k => map[k]);
    }

    // 저장 요청 직렬화: 같은 키(날짜/연월)의 저장이 진행 중이면 완료 후 최신본 1회만 재전송
    const saveQueues = {};
    function enqueueSave(key, sendLatest) {
      const q = saveQueues[key] || (saveQueues[key] = { busy: false, pending: false });
      if (q.busy) { q.pending = true; return; }
      q.busy = true;
      (async () => {
        do {
          q.pending = false;
          await sendLatest();
        } while (q.pending);
        q.busy = false;
      })();
    }

    function showLoading(show) {
      document.getElementById('loading').classList.toggle('active', show);
    }

    // ==========================================
    // Monthly Plan Logic
    // ==========================================
    async function loadMonthlyPlan() {
      const ym = getYearMonth();

      if (getApiUrl()) {
        const data = await apiGet('getMonthlyPlan', { yearMonth: ym });
        if (data && !data.error) {
          const remoteItems = dedupeById(data.items || []);
          const localRaw = localStorage.getItem(MONTHLY_PLAN_PREFIX + ym);
          const localItems = localRaw ? JSON.parse(localRaw) : [];
          // 원격 데이터가 있으면 사용, 없으면 로컬 유지
          if (remoteItems.length > 0 || localItems.length === 0) {
            monthlyPlanItems = remoteItems;
            localStorage.setItem(MONTHLY_PLAN_PREFIX + ym, JSON.stringify(monthlyPlanItems));
          } else {
            monthlyPlanItems = localItems;
          }
          renderMonthlyPlan();
          return;
        }
      }

      const local = localStorage.getItem(MONTHLY_PLAN_PREFIX + ym);
      monthlyPlanItems = local ? JSON.parse(local) : [];
      renderMonthlyPlan();
    }

    function saveMonthlyPlanData() {
      const ym = getYearMonth();
      localStorage.setItem(MONTHLY_PLAN_PREFIX + ym, JSON.stringify(monthlyPlanItems));

      if (!getApiUrl()) return;

      enqueueSave('mp_' + ym, async () => {
        const raw = localStorage.getItem(MONTHLY_PLAN_PREFIX + ym);
        const items = raw ? JSON.parse(raw) : [];
        await apiPost({ action: 'saveMonthlyPlan', yearMonth: ym, items: items });
      });
    }

    function toggleMonthlySection() {
      const body = document.getElementById('monthlyPlanBody');
      const toggle = document.getElementById('monthlyToggle');
      const isOpen = body.style.display !== 'none';
      body.style.display = isOpen ? 'none' : 'block';
      toggle.classList.toggle('open', !isOpen);
    }

    function renderMonthlyPlan() {
      const done = monthlyPlanItems.filter(i => i.done).length;
      const total = monthlyPlanItems.length;
      document.getElementById('monthlyProgress').textContent = `${done}/${total}`;

      const container = document.getElementById('monthlyItems');
      if (monthlyPlanItems.length === 0) {
        container.innerHTML = '<div style="padding:8px 0;color:var(--text-light);font-size:13px;">월 계획 항목이 없습니다</div>';
        return;
      }

      container.innerHTML = monthlyPlanItems.map(item => `
        <div class="monthly-item ${item.done ? 'done' : ''}">
          <div class="checkbox" onclick="toggleMonthlyItem('${item.id}')"></div>
          <span class="monthly-name">${escapeHtml(item.name)}</span>
          <button class="delete-btn" onclick="deleteMonthlyItem('${item.id}')">&times;</button>
        </div>
      `).join('');
    }

    function toggleMonthlyItem(id) {
      const item = monthlyPlanItems.find(i => i.id === id);
      if (!item) return;
      item.done = !item.done;
      saveMonthlyPlanData();
      renderMonthlyPlan();
    }

    function deleteMonthlyItem(id) {
      monthlyPlanItems = monthlyPlanItems.filter(i => i.id !== id);
      saveMonthlyPlanData();
      renderMonthlyPlan();
    }

    function addMonthlyItem() {
      const input = document.getElementById('newMonthlyItemInput');
      const name = input.value.trim();
      if (!name) return;

      monthlyPlanItems.push({
        id: 'm' + Date.now(),
        name: name,
        done: false,
        order: monthlyPlanItems.length + 1
      });

      input.value = '';
      saveMonthlyPlanData();
      renderMonthlyPlan();
      showToast('월 계획 항목 추가됨');
    }

    // ==========================================
    // Priority Toggle
    // ==========================================
    function togglePriority(p) {
      selectedPriority = selectedPriority === p ? null : p;
      document.querySelectorAll('.add-item-wrapper .priority-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.priority === selectedPriority);
      });
    }

    // ==========================================
    // 시간 파싱 유틸 (글자로 쓴 시간 인식 + 저장값 정규화)
    // ==========================================
    const pad2 = (n) => String(n).padStart(2, '0');

    // "오전10시 지유병원", "지유병원 오후 3시30분", "14시 회의", "10:30 콜", "1시반 미팅" 등에서 시간 추출
    // 반환: { time: 'HH:MM', rest: '시간표현을 제거한 나머지 텍스트' } / 못 찾으면 null
    function parseTimeFromText(text) {
      if (!text) return null;
      const src = String(text);

      const MERI = '오전|오후|아침|점심|저녁|밤|새벽|낮';
      const patterns = [
        // 10:30 / 오후 3:30
        new RegExp('(^|[^0-9])(' + MERI + ')?\\s*([0-9]{1,2})\\s*:\\s*([0-9]{2})'),
        // 10시 / 오전10시 / 3시30분 / 1시반  ("3시간"은 제외)
        new RegExp('(^|[^0-9])(' + MERI + ')?\\s*([0-9]{1,2})\\s*시(?!간)\\s*(?:(반)|([0-9]{1,2})\\s*분?)?'),
        // 정오 / 자정
        /(^|[^0-9])(정오|자정)/
      ];

      for (let p = 0; p < patterns.length; p++) {
        const m = src.match(patterns[p]);
        if (!m) continue;

        let h, min;
        if (p === 2) {
          h = m[2] === '정오' ? 12 : 0;
          min = 0;
        } else {
          const meri = m[2] || '';
          h = parseInt(m[3], 10);
          if (p === 0) {
            min = parseInt(m[4], 10);
          } else {
            min = m[4] === '반' ? 30 : (m[5] !== undefined ? parseInt(m[5], 10) : 0);
          }
          if (isNaN(h) || isNaN(min) || h > 23 || min > 59) continue;

          if (meri === '오전' || meri === '아침' || meri === '새벽') {
            if (h === 12) h = 0;                       // 오전 12시 = 0시
          } else if (meri === '밤') {
            h = h === 12 ? 0 : (h < 12 ? h + 12 : h);  // 밤 12시 = 0시
          } else if (meri) {
            if (h < 12) h += 12;                       // 오후/저녁/점심/낮
          } else if (p === 1) {
            // "3시" 처럼 오전·오후 없이 '시'로 쓴 경우만 1~5시를 오후로 해석
            // (10:30 같은 시:분 표기는 적힌 그대로)
            if (h >= 1 && h <= 5) h += 12;
          }
          if (h > 23) continue;
        }

        // 매칭된 시간 표현만 제거하고 앞 문자(m[1])는 살림
        const rest = (src.slice(0, m.index) + m[1] + src.slice(m.index + m[0].length))
          .replace(/\s+/g, ' ')
          .replace(/^[\s,\-~:]+|[\s,\-~:]+$/g, '')
          .trim();

        return { time: pad2(h) + ':' + pad2(min), rest: rest };
      }
      return null;
    }

    // 저장/시트에서 온 마감시간 값을 'HH:MM' 문자열로 정규화 (없으면 null)
    function normalizeTime(value) {
      if (value === null || value === undefined || value === '') return null;
      if (value instanceof Date) {
        return isNaN(value.getTime()) ? null : pad2(value.getHours()) + ':' + pad2(value.getMinutes());
      }
      const s = String(value).trim();
      if (!s) return null;

      // 1) 정상 저장값: 'HH:MM' (초가 붙어와도 허용)
      const m = s.match(/^([0-9]{1,2}):([0-9]{2})(?::[0-9]{2})?$/);
      if (m) {
        const h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
        if (h <= 23 && mi <= 59) return pad2(h) + ':' + pad2(mi);
      }

      // 2) 구글 시트가 시간을 날짜값으로 저장한 경우
      //    ISO("1899-12-30T...") 또는 "Sat Dec 30 1899 06:00:00 GMT+0827 (한국 표준시)"
      if (s.includes('T') || /[0-9]{4}/.test(s)) {
        const d = new Date(s);
        if (!isNaN(d.getTime())) return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
      }

      // 3) 한글 시간 표현
      const parsed = parseTimeFromText(s);
      return parsed ? parsed.time : null;
    }

    // 마감시간 → 분 단위 (없으면 Infinity: 시간 없는 항목은 맨 아래)
    function deadlineMinutes(item) {
      const t = normalizeTime(item.deadline);
      if (!t) return Infinity;
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    // 항목 리스트의 마감시간을 일괄 정규화
    function normalizeItems(items) {
      return (items || []).map(it => Object.assign({}, it, { deadline: normalizeTime(it.deadline) }));
    }

    // ==========================================
    // Checklist Logic
    // ==========================================
    async function loadChecklist() {
      const dateStr = formatDate(currentDate);
      editingId = null;   // 날짜 이동/재로드 시 수정 모드 해제

      if (getApiUrl()) {
        showLoading(true);
        const data = await apiGet('getChecklist', { date: dateStr });
        showLoading(false);

        if (data && !data.error) {
          const remoteItems = normalizeItems(dedupeById(data.items || []));
          const localItems = loadLocalChecklist(dateStr) || [];
          // 원격 데이터가 있으면 사용, 없으면 로컬 유지
          if (remoteItems.length > 0 || localItems.length === 0) {
            checklistItems = remoteItems;
            saveLocalChecklist(dateStr, checklistItems);
          } else {
            checklistItems = localItems;
          }
          renderChecklist();
          return;
        }
      }

      const local = loadLocalChecklist(dateStr);
      checklistItems = normalizeItems(local || []);
      renderChecklist();
    }

    // 정렬: 1) 마감시간 이른 순(시간 없는 항목은 아래) 2) 등급 A>B>C 3) 입력순
    function sortChecklistItems() {
      const priorityOrder = { A: 1, B: 2, C: 3 };
      checklistItems.sort((a, b) => {
        const da = deadlineMinutes(a);
        const db = deadlineMinutes(b);
        if (da !== db) return da - db;
        const pa = priorityOrder[a.priority] || 4;
        const pb = priorityOrder[b.priority] || 4;
        if (pa !== pb) return pa - pb;
        return (a.order || 0) - (b.order || 0);
      });
      // 화면 순서 = 저장 순서가 되도록 순번 재부여
      checklistItems.forEach((it, idx) => { it.order = idx + 1; });
    }

    function renderChecklist() {
      sortChecklistItems();

      const container = document.getElementById('additionalItems');
      container.innerHTML = checklistItems.length > 0
        ? checklistItems.map(item => item.id === editingId ? renderEditForm(item) : renderItem(item)).join('')
        : '<div style="padding:8px;color:var(--text-light);font-size:13px;">항목 없음 - 아래에서 추가하세요</div>';

      updateProgress();

      if (editingId) {
        const input = document.getElementById('editName');
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      }
    }

    function renderItem(item) {
      const priorityBadge = item.priority
        ? `<span class="priority-badge ${item.priority}">${item.priority}</span>`
        : '';

      let deadlineHtml = '';
      const time = normalizeTime(item.deadline);
      if (time) {
        const isOverdue = isDeadlineOverdue(item);
        deadlineHtml = `<div class="deadline-text ${isOverdue ? 'overdue' : ''}">${formatDeadlineDisplay(time)}까지</div>`;
      }

      return `
        <div class="checklist-item ${item.done ? 'done' : ''}" data-id="${item.id}">
          <div class="checkbox" onclick="toggleItem('${item.id}')"></div>
          ${priorityBadge}
          <div class="item-content" onclick="startEdit('${item.id}')">
            <span class="item-name">${escapeHtml(item.name)}</span>
            ${deadlineHtml}
          </div>
          <button class="edit-btn" onclick="startEdit('${item.id}')">&#9998;</button>
          <button class="delete-btn" onclick="deleteItem('${item.id}')">&times;</button>
        </div>
      `;
    }

    // 인라인 수정 폼 (내용/시간/등급 모두 수정)
    function renderEditForm(item) {
      const time = normalizeTime(item.deadline) || '';
      const prioBtn = (p) => `<button class="priority-btn${editPriority === p ? ' active' : ''}" data-priority="${p}" onclick="toggleEditPriority('${p}')">${p}</button>`;

      return `
        <div class="checklist-item editing" data-id="${item.id}">
          <div class="edit-form">
            <div class="edit-row">
              <input type="text" class="edit-name" id="editName" value="${escapeAttr(item.name)}"
                     placeholder="내용 (예: 오전10시 지유병원)"
                     onkeydown="if(event.key==='Enter')saveEdit();if(event.key==='Escape')cancelEdit()">
            </div>
            <div class="edit-row">
              <div class="time-group">
                <input type="time" id="editDeadline" value="${time}">
                <span class="until-label">까지</span>
              </div>
              <div class="priority-group">
                ${prioBtn('A')}${prioBtn('B')}${prioBtn('C')}
              </div>
            </div>
            <div class="edit-row">
              <div class="edit-actions">
                <button class="cancel-btn" onclick="cancelEdit()">취소</button>
                <button class="save-btn" onclick="saveEdit()">저장</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function startEdit(id) {
      const item = checklistItems.find(i => i.id === id);
      if (!item) return;
      editingId = id;
      editPriority = item.priority || null;
      renderChecklist();
    }

    function cancelEdit() {
      editingId = null;
      editPriority = null;
      renderChecklist();
    }

    function toggleEditPriority(p) {
      editPriority = editPriority === p ? null : p;
      document.querySelectorAll('.checklist-item.editing .priority-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.priority === editPriority);
      });
    }

    async function saveEdit() {
      const item = checklistItems.find(i => i.id === editingId);
      if (!item) { cancelEdit(); return; }

      const nameInput = document.getElementById('editName');
      const timeInput = document.getElementById('editDeadline');
      let name = (nameInput.value || '').trim();
      if (!name) { showToast('내용을 입력하세요'); return; }

      // 내용에 시간을 글자로 적었으면 그걸 마감시간으로 (예: "오후3시 미팅")
      let deadline = timeInput.value || null;
      const parsed = parseTimeFromText(name);
      if (parsed && parsed.rest) {
        name = parsed.rest;
        deadline = parsed.time;
      }

      item.name = name;
      item.deadline = normalizeTime(deadline);
      item.priority = editPriority;

      editingId = null;
      editPriority = null;
      renderChecklist();
      await saveChecklist();
      showToast('수정됨');
    }

    function isDeadlineOverdue(item) {
      const time = normalizeTime(item.deadline);
      if (!time) return false;
      const today = formatDate(new Date());
      const dateStr = formatDate(currentDate);
      if (dateStr !== today) return false;

      const now = new Date();
      const [h, m] = time.split(':').map(Number);
      return now.getHours() > h || (now.getHours() === h && now.getMinutes() > m);
    }

    function formatDeadlineDisplay(timeStr) {
      const t = normalizeTime(timeStr);
      if (!t) return String(timeStr || '');
      const [h, m] = t.split(':').map(Number);
      const period = h < 12 ? '오전' : '오후';
      const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
      return `${period} ${h12}:${pad2(m)}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function escapeAttr(text) {
      return escapeHtml(text).replace(/"/g, '&quot;');
    }

    function updateProgress() {
      const total = checklistItems.length;
      const done = checklistItems.filter(i => i.done).length;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;

      document.getElementById('progressCount').textContent = `${done}/${total}`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    async function toggleItem(id) {
      const item = checklistItems.find(i => i.id === id);
      if (!item) return;

      item.done = !item.done;
      renderChecklist();
      await saveChecklist();
    }

    async function deleteItem(id) {
      checklistItems = checklistItems.filter(i => i.id !== id);
      renderChecklist();
      await saveChecklist();
    }

    async function addItem() {
      const input = document.getElementById('newItemInput');
      let name = input.value.trim();
      if (!name) return;

      const deadlineInput = document.getElementById('newItemDeadline');
      let deadline = deadlineInput.value || null;

      // 글자로 쓴 시간 인식: "오전10시 지유병원" → 10:00 + "지유병원"
      const parsed = parseTimeFromText(name);
      if (parsed && parsed.rest) {
        name = parsed.rest;
        deadline = parsed.time;
      }
      deadline = normalizeTime(deadline);

      const maxOrder = checklistItems.reduce((max, i) => Math.max(max, i.order || 0), 0);
      checklistItems.push({
        name: name,
        done: false,
        type: '추가',
        order: maxOrder + 1,
        id: 'a' + Date.now(),
        deadline: deadline,
        priority: selectedPriority
      });

      input.value = '';
      deadlineInput.value = '';
      selectedPriority = null;
      document.querySelectorAll('.add-item-wrapper .priority-btn').forEach(btn => btn.classList.remove('active'));

      renderChecklist();
      await saveChecklist();
      showToast(deadline ? `${formatDeadlineDisplay(deadline)} 항목 추가됨` : '항목 추가됨');
    }

    async function saveChecklist() {
      const dateStr = formatDate(currentDate);
      saveLocalChecklist(dateStr, checklistItems);

      if (!getApiUrl()) return;

      // 연타 시 동시 전송 → 서버에서 중복 저장되는 경합 방지: 날짜별로 직렬화
      enqueueSave('cl_' + dateStr, async () => {
        const items = loadLocalChecklist(dateStr) || []; // 전송 시점의 최신본
        const result = await apiPost({ action: 'saveChecklist', date: dateStr, items: items });
        if (!result) showToast('⚠️ 서버 저장 실패 (로컬에는 저장됨)');
      });
    }

    function saveLocalChecklist(dateStr, items) {
      localStorage.setItem(LOCAL_DATA_PREFIX + dateStr, JSON.stringify(items));
    }

    function loadLocalChecklist(dateStr) {
      const data = localStorage.getItem(LOCAL_DATA_PREFIX + dateStr);
      return data ? JSON.parse(data) : null;
    }

    // ==========================================
    // Stats Logic (통계 분석)
    // ==========================================
    // 업무 거래처 감지 (병원/약국 등)
    const WORK_PLACE_RE = /(병원|의원|약국|클리닉|내과|외과|정형|이비인후|소아과|피부과|비뇨|산부인과|안과|치과|한의원|보건소|메디컬|온누리)/;

    // 생활 카테고리 (먼저 매칭되는 순서대로 분류)
    const CATEGORIES = [
      { key: '업무',     re: /(병원|의원|약국|클리닉|내과|외과|정형|이비인후|소아과|피부과|비뇨|산부인과|안과|치과|한의원|보건소|메디컬|온누리|방명록|경비|실적|보고|미팅|회의|디테일|심포지|거래처|입력|결재|제출|발주|영업|지점|콜)/ },
      { key: '건강/운동', re: /(운동|헬스|러닝|달리기|조깅|산책|걷기|스트레칭|요가|홈트|푸시업|스쿼트|금주|다이어트|체중|영양제|물\s*마시기|수면|일찍)/ },
      { key: '자기계발',  re: /(공부|독서|책|강의|영어|학습|블로그|유튜브|글쓰기|자격증|코딩|명상|일기)/ },
      { key: '재테크',    re: /(주식|투자|매수|매도|SOXL|soxl|적금|연금|리밸런싱|증권|코인|배당)/ },
      { key: '가족/생활', re: /(가족|아내|와이프|아이|아들|딸|부모|어머니|아버지|장보기|청소|빨래|집안일|요리|설거지|은행|택배|미용실|세차|이사|선물|생일)/ }
    ];

    function categorize(name) {
      for (const c of CATEGORIES) {
        if (c.re.test(name)) return c.key;
      }
      return '기타';
    }

    function setStatsMode(mode) {
      statsMode = mode;
      statsAnchor = new Date();
      document.getElementById('modeWeek').classList.toggle('active', mode === 'week');
      document.getElementById('modeMonth').classList.toggle('active', mode === 'month');
      loadStats();
    }

    function moveStatsPeriod(delta) {
      if (statsMode === 'week') {
        statsAnchor.setDate(statsAnchor.getDate() + delta * 7);
      } else {
        statsAnchor.setDate(1); // 말일 넘김 방지
        statsAnchor.setMonth(statsAnchor.getMonth() + delta);
      }
      loadStats();
    }

    // 기간의 날짜 목록 + 라벨
    function getStatsRange() {
      const dates = [];
      let label = '';
      if (statsMode === 'week') {
        const sunday = new Date(statsAnchor);
        sunday.setDate(sunday.getDate() - sunday.getDay());
        for (let i = 0; i < 7; i++) {
          const d = new Date(sunday);
          d.setDate(sunday.getDate() + i);
          dates.push(formatDate(d));
        }
        const end = new Date(sunday);
        end.setDate(sunday.getDate() + 6);
        label = `${sunday.getMonth() + 1}.${sunday.getDate()} ~ ${end.getMonth() + 1}.${end.getDate()}`;
      } else {
        const y = statsAnchor.getFullYear();
        const m = statsAnchor.getMonth();
        const lastDay = new Date(y, m + 1, 0).getDate();
        for (let i = 1; i <= lastDay; i++) {
          dates.push(formatDate(new Date(y, m, i)));
        }
        label = `${y}년 ${m + 1}월`;
      }
      return { dates, label };
    }

    // 기간 데이터 수집: 신규 range API → (구버전 폴백) 날짜별 조회 → 로컬
    async function fetchRangeItems(dates) {
      const days = {};
      if (getApiUrl()) {
        const data = await apiGet('getChecklistRange', { start: dates[0], end: dates[dates.length - 1] });
        if (data && !data.error && data.days) {
          Object.keys(data.days).forEach(d => { data.days[d] = dedupeById(data.days[d]); });
          return data.days;
        }

        // Apps Script가 구버전이면 날짜별 개별 조회로 폴백
        const results = await Promise.all(dates.map(d => apiGet('getChecklist', { date: d })));
        dates.forEach((d, i) => {
          const r = results[i];
          if (r && !r.error && r.items && r.items.length > 0) {
            days[d] = dedupeById(r.items);
          } else {
            const loc = loadLocalChecklist(d);
            if (loc && loc.length > 0) days[d] = loc;
          }
        });
        return days;
      }
      // 오프라인: 로컬 데이터만
      dates.forEach(d => {
        const loc = loadLocalChecklist(d);
        if (loc && loc.length > 0) days[d] = loc;
      });
      return days;
    }

    // ------------------------------------------
    // 장기(최근 90일) 데이터 — 실행 레버/밀린 약속/스트릭/이전 기간 비교용
    // ------------------------------------------
    const LONG_DAYS = 90;

    function longRangeDates() {
      const list = [];
      const today = new Date();
      for (let i = LONG_DAYS - 1; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        list.push(formatDate(d));
      }
      return list;
    }

    async function fetchLongRange() {
      const dates = longRangeDates();
      const key = dates[0] + '_' + dates[dates.length - 1];
      if (statsLong && statsLong.key === key) return statsLong.days;

      let days = {};
      if (getApiUrl()) {
        const data = await apiGet('getChecklistRange', { start: dates[0], end: dates[dates.length - 1] });
        if (data && !data.error && data.days) {
          Object.keys(data.days).forEach(d => { data.days[d] = normalizeItems(dedupeById(data.days[d])); });
          days = data.days;
        }
      }
      // range API가 안 되면 로컬 데이터만 사용 (90회 개별 조회는 하지 않음)
      if (Object.keys(days).length === 0) {
        dates.forEach(d => {
          const loc = loadLocalChecklist(d);
          if (loc && loc.length > 0) days[d] = normalizeItems(loc);
        });
      }
      statsLong = { key, days, dates };
      return days;
    }

    // 완료율 계산 헬퍼
    const rateOf = (b) => b.t > 0 ? Math.round(b.d / b.t * 100) : 0;
    const bump = (b, done) => { b.t++; if (done) b.d++; };

    // 실행 레버: "무엇이 내 완료율을 바꾸는가" (최근 90일 기준)
    function analyzeLevers(days90) {
      const todayStr = formatDate(new Date());
      const flat = [];
      Object.keys(days90).forEach(d => {
        if (d > todayStr) return;                       // 미래는 제외
        (days90[d] || []).forEach(it => flat.push({ ...it, date: d }));
      });
      if (flat.length < 10) return { levers: [], n: flat.length };

      const withTime = { t: 0, d: 0 }, noTime = { t: 0, d: 0 };
      const withPrio = { t: 0, d: 0 }, noPrio = { t: 0, d: 0 };
      flat.forEach(i => {
        bump(normalizeTime(i.deadline) ? withTime : noTime, i.done);
        bump(i.priority ? withPrio : noPrio, i.done);
      });

      // 하루 항목 수 구간별
      const sizeBuckets = { '1~3개': { t: 0, d: 0 }, '4~6개': { t: 0, d: 0 }, '7~9개': { t: 0, d: 0 }, '10개+': { t: 0, d: 0 } };
      // 요일별
      const dowNames = ['일', '월', '화', '수', '목', '금', '토'];
      const dowB = {};
      Object.keys(days90).forEach(d => {
        if (d > todayStr) return;
        const items = days90[d] || [];
        if (!items.length) return;
        const key = items.length <= 3 ? '1~3개' : items.length <= 6 ? '4~6개' : items.length <= 9 ? '7~9개' : '10개+';
        const dw = new Date(d + 'T00:00:00').getDay();
        if (!dowB[dw]) dowB[dw] = { t: 0, d: 0, days: 0 };
        dowB[dw].days++;
        items.forEach(i => { bump(sizeBuckets[key], i.done); bump(dowB[dw], i.done); });
      });

      const levers = [];
      const push = (name, on, onLbl, off, offLbl, note) => {
        if (on.t < 5 || off.t < 5) return;
        levers.push({ name, onRate: rateOf(on), onLbl, on, offRate: rateOf(off), offLbl, off,
                      delta: rateOf(on) - rateOf(off), note });
      };

      push('시간을 적으면', withTime, '시간 있음', noTime, '시간 없음',
           `시간 지정 비율 ${Math.round(withTime.t / flat.length * 100)}%`);
      push('등급을 매기면', withPrio, '등급 있음', noPrio, '등급 없음',
           `등급 지정 비율 ${Math.round(withPrio.t / flat.length * 100)}%`);

      // 하루 계획 분량: 가장 높은 구간 vs 가장 낮은 구간 (구간당 10개 이상일 때만)
      const sizeList = Object.entries(sizeBuckets).filter(([, v]) => v.t >= 10);
      if (sizeList.length >= 2) {
        const sorted = [...sizeList].sort((a, b) => rateOf(b[1]) - rateOf(a[1]));
        const best = sorted[0], worst = sorted[sorted.length - 1];
        levers.push({ name: '하루 계획 분량', onRate: rateOf(best[1]), onLbl: best[0], on: best[1],
                      offRate: rateOf(worst[1]), offLbl: worst[0], off: worst[1],
                      delta: rateOf(best[1]) - rateOf(worst[1]),
                      note: `${worst[0]} 적은 날이 가장 낮음 — 계획을 줄인 날이 오히려 무너집니다`,
                      bestSize: best[0], worstSize: worst[0] });
      }

      // 요일: 최고 vs 최저 (요일당 항목 15개 & 3일 이상 기록됐을 때만 — 표본 부족 착시 방지)
      const dowList = Object.entries(dowB).filter(([, v]) => v.t >= 15 && v.days >= 3);
      if (dowList.length >= 3) {
        const sorted = [...dowList].sort((a, b) => rateOf(b[1]) - rateOf(a[1]));
        const best = sorted[0], worst = sorted[sorted.length - 1];
        levers.push({ name: '요일에 따라', onRate: rateOf(best[1]), onLbl: dowNames[best[0]] + '요일', on: best[1],
                      offRate: rateOf(worst[1]), offLbl: dowNames[worst[0]] + '요일', off: worst[1],
                      delta: rateOf(best[1]) - rateOf(worst[1]),
                      note: `${dowNames[worst[0]]}요일이 가장 약함 (기록 ${worst[1].days}일)`,
                      worstDow: dowNames[worst[0]], worstRate: rateOf(worst[1]),
                      bestDow: dowNames[best[0]] });
      }

      levers.sort((a, b) => b.delta - a.delta);
      return { levers: levers.filter(l => l.delta >= 5), n: flat.length,
               withTime, noTime, withPrio, noPrio, sizeBuckets, dowB, dowNames };
    }

    // 밀린 약속: 여러 날 올렸지만 끝내 못 끝낸 항목
    function findStalled(days90) {
      const todayStr = formatDate(new Date());
      const map = {};
      Object.keys(days90).sort().forEach(d => {
        if (d > todayStr) return;
        (days90[d] || []).forEach(it => {
          const name = String(it.name || '').trim();
          if (!name) return;
          if (!map[name]) map[name] = { name, first: d, last: d, tries: 0, misses: 0, lastDone: false };
          const m = map[name];
          m.last = d;
          m.tries++;
          if (it.done) m.lastDone = true; else { m.misses++; m.lastDone = false; }
        });
      });

      const today = new Date(todayStr + 'T00:00:00');
      const daysBetween = (a, b) => Math.round((b - new Date(a + 'T00:00:00')) / 86400000);

      return Object.values(map)
        .filter(m => !m.lastDone && m.misses >= 2 && m.last < todayStr)
        .map(m => ({ ...m, ageDays: daysBetween(m.first, today), sinceDays: daysBetween(m.last, today) }))
        // 많이 미룬 것 우선, 같으면 최근에 시도한 것 먼저 (아직 살아있는 약속)
        .sort((a, b) => (b.misses - a.misses) || (a.sinceDays - b.sinceDays))
        .slice(0, 6);
    }

    // 기록 스트릭 (연속으로 체크리스트를 쓴 날)
    function computeStreak(days90) {
      const has = (d) => (days90[d] || []).length > 0;
      const today = new Date();

      let current = 0;
      for (let i = 0; i < LONG_DAYS; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        const k = formatDate(d);
        if (has(k)) current++;
        else if (i === 0) continue;   // 오늘은 아직 안 썼을 수 있음
        else break;
      }

      const keys = Object.keys(days90).filter(has).sort();
      let best = 0, run = 0, prev = null;
      keys.forEach(k => {
        const dt = new Date(k + 'T00:00:00');
        run = (prev && Math.round((dt - prev) / 86400000) === 1) ? run + 1 : 1;
        if (run > best) best = run;
        prev = dt;
      });

      const recorded = keys.length;
      return { current, best, recorded, rate: Math.round(recorded / LONG_DAYS * 100) };
    }

    // 이전 기간 달성률 (90일 캐시 안에 있을 때만)
    function prevPeriodRate(dates, days90) {
      const len = dates.length;
      const first = new Date(dates[0] + 'T00:00:00');
      const prevDates = [];
      for (let i = len; i >= 1; i--) {
        const d = new Date(first);
        d.setDate(first.getDate() - i);
        prevDates.push(formatDate(d));
      }
      const covered = statsLong && statsLong.dates && prevDates.every(d => statsLong.dates.includes(d));
      if (!covered) return null;

      let t = 0, dn = 0;
      prevDates.forEach(d => (days90[d] || []).forEach(i => { t++; if (i.done) dn++; }));
      if (t === 0) return null;
      return Math.round(dn / t * 100);
    }

    async function loadStats() {
      const { dates, label } = getStatsRange();
      document.getElementById('statsPeriodLabel').textContent = label;

      showLoading(true);
      const [days, days90] = await Promise.all([fetchRangeItems(dates), fetchLongRange()]);
      showLoading(false);

      renderStats(dates, days, days90);
    }

    function analyzeStats(dates, days) {
      const todayStr = formatDate(new Date());
      const flat = [];
      dates.forEach(d => (days[d] || []).forEach(it => flat.push({ ...it, date: d })));

      const total = flat.length;
      const done = flat.filter(i => i.done).length;
      const rate = total > 0 ? Math.round(done / total * 100) : 0;

      // 우선순위별
      const byPrio = { A: { t: 0, d: 0 }, B: { t: 0, d: 0 }, C: { t: 0, d: 0 }, N: { t: 0, d: 0 } };
      flat.forEach(i => {
        const p = byPrio[i.priority] ? i.priority : 'N';
        byPrio[p].t++;
        if (i.done) byPrio[p].d++;
      });

      // 일별 추이
      const daily = dates.map(d => {
        const items = days[d] || [];
        const t = items.length;
        const dn = items.filter(i => i.done).length;
        return { date: d, t, d: dn, rate: t > 0 ? dn / t : null, isToday: d === todayStr, isFuture: d > todayStr };
      });

      const activeDays = daily.filter(x => x.t > 0).length;
      const perfectDays = daily.filter(x => x.t > 0 && x.d === x.t).length;

      // 항목명별 집계 (놓친/완료 TOP)
      const missMap = {}, doneMap = {};
      flat.forEach(i => {
        const key = String(i.name).trim();
        if (!key) return;
        // 미래 날짜의 미완료는 '놓친 것'이 아님
        if (i.done) doneMap[key] = (doneMap[key] || 0) + 1;
        else if (i.date <= todayStr) missMap[key] = (missMap[key] || 0) + 1;
      });
      const topMissed = Object.entries(missMap).sort((a, b) => b[1] - a[1]).slice(0, 5);
      const topDone = Object.entries(doneMap).sort((a, b) => b[1] - a[1]).slice(0, 5);

      // 업무 거래처 (병원/약국)
      const workItems = flat.filter(i => WORK_PLACE_RE.test(String(i.name)));
      const workDone = workItems.filter(i => i.done).length;
      const placeMap = {};
      workItems.forEach(i => {
        const key = String(i.name).trim();
        if (!placeMap[key]) placeMap[key] = { t: 0, d: 0 };
        placeMap[key].t++;
        if (i.done) placeMap[key].d++;
      });
      const topPlaces = Object.entries(placeMap).sort((a, b) => b[1].t - a[1].t).slice(0, 7);

      // 카테고리별
      const catMap = {};
      flat.forEach(i => {
        const c = categorize(String(i.name));
        if (!catMap[c]) catMap[c] = { t: 0, d: 0 };
        catMap[c].t++;
        if (i.done) catMap[c].d++;
      });
      const catList = Object.entries(catMap).sort((a, b) => b[1].t - a[1].t);

      // 요일별 달성률 (2일 이상 데이터가 있을 때만 의미)
      const dowNames = ['일', '월', '화', '수', '목', '금', '토'];
      const dowMap = {};
      daily.forEach(x => {
        if (x.t === 0) return;
        const dow = new Date(x.date + 'T00:00:00').getDay();
        if (!dowMap[dow]) dowMap[dow] = { t: 0, d: 0, days: 0 };
        dowMap[dow].t += x.t;
        dowMap[dow].d += x.d;
        dowMap[dow].days++;
      });

      // 마감시간 패턴 (완료 항목의 마감시각 평균)
      const deadlineHours = flat
        .filter(i => i.done && i.deadline)
        .map(i => {
          const s = String(i.deadline);
          const m = s.match(/(\d{1,2}):(\d{2})/);
          return m ? parseInt(m[1], 10) : null;
        })
        .filter(h => h !== null);

      return { total, done, rate, byPrio, daily, activeDays, perfectDays,
               topMissed, topDone, workItems, workDone, topPlaces,
               catList, dowMap, dowNames, deadlineHours };
    }

    // ------------------------------------------
    // 새록 복기: 진단(숫자) + 이번 기간 처방 3개 + 한 문장
    // ------------------------------------------
    const REVIEW_QUOTES = [
      { min: 80, t: '"탁월함은 습관이다." — 아리스토텔레스. 지금 수준을 기준선으로 굳혀라. 잘한 날을 표준으로 만들지 못하면 그저 운 좋은 한 주로 끝난다.' },
      { min: 60, t: '"통제할 수 있는 것과 없는 것을 구분하라." — 에픽테토스. 거래처의 응답은 통제 밖이지만, 시간을 적고 등급을 매기는 건 100% 네 손 안이다.' },
      { min: 40, t: '"인간은 극복되어야 할 무엇이다." — 니체. 절반의 실행은 절반의 자신이다. 나머지 절반은 의지가 아니라 설계로 채운다.' },
      { min: 0,  t: '"의지는 늘 자기를 속인다." — 쇼펜하우어. 마음을 다잡는 대신 조건을 바꿔라. 시간과 등급을 적는 30초가 하루를 바꾼다.' }
    ];

    function pickQuote(rate) {
      return (REVIEW_QUOTES.find(q => rate >= q.min) || REVIEW_QUOTES[REVIEW_QUOTES.length - 1]).t;
    }

    // 받침 여부에 따른 조사 선택 (['은','는'] / ['이','가'] / ['을','를'])
    function josa(word, pair) {
      const ch = String(word).trim().slice(-1);
      const code = ch.charCodeAt(0);
      if (code >= 0xAC00 && code <= 0xD7A3) {
        return ((code - 0xAC00) % 28) !== 0 ? pair[0] : pair[1];
      }
      return pair[1];
    }

    // 진단 문장 (전부 실제 수치에 연결)
    function buildDiagnosis(s, lev, stalled, streak, prevRate) {
      const out = [];
      const periodName = statsMode === 'week' ? '이번 주' : '이번 달';

      // 0. 기간에 기록이 아예 없을 때
      if (s.total === 0) {
        out.push(['&#128465;&#65039;', `${periodName}엔 <b>기록이 하나도 없다</b>. 계획하지 않은 하루는 남의 계획대로 흘러간 하루다.`]);
        if (streak.best > 0) {
          out.push(['&#128293;', `최근 90일 기록률 <b>${streak.rate}%</b>, 최장 연속 <b>${streak.best}일</b>. 다시 시작하는 데 필요한 건 3줄이다.`]);
        }
        const top0 = lev.levers[0];
        if (top0) out.push(['&#128295;', `참고로 <b>${top0.name}</b> 완료율이 ${top0.offRate}% → <b>${top0.onRate}%</b>로 갈린다. 다시 적을 때 이 조건부터 챙겨라.`]);
        return out;
      }

      // 1. 달성률 + 직전 기간 대비
      let deltaTxt = '';
      if (prevRate !== null) {
        const d = s.rate - prevRate;
        deltaTxt = d > 0 ? ` 직전 기간 ${prevRate}%에서 <b>+${d}%p</b>. 방향은 맞다.`
                 : d < 0 ? ` 직전 기간 ${prevRate}%에서 <b>${d}%p</b>. 내려가는 중이다.`
                 : ` 직전 기간과 같은 ${prevRate}%. 정체다.`;
      }
      out.push(['&#128202;', `${periodName} 달성률 <b>${s.rate}%</b> (${s.done}/${s.total}).${deltaTxt}`]);

      // 2. 기록 자체 — 안 쓴 날은 통계에 잡히지도 않는다
      const past = s.daily.filter(x => !x.isFuture).length;
      const missing = past - s.activeDays;
      if (missing > 0) {
        out.push(['&#128197;', `${periodName} 지난 ${past}일 중 <b>${missing}일은 기록조차 없다</b>. 측정하지 않은 날은 좋았는지 나빴는지도 말할 수 없다.`]);
      } else if (past > 0) {
        out.push(['&#128197;', `${periodName} 지난 ${past}일 <b>전부 기록</b>했다. 측정되는 삶은 이미 절반 이긴 것이다.`]);
      }

      // 3. 최대 레버 — 개인 데이터로 증명된 실행 조건
      const top = lev.levers[0];
      if (top) {
        out.push(['&#128295;', `최근 90일 기준, <b>${top.name}</b> 완료율이 ${top.offLbl} ${top.offRate}% → ${top.onLbl} <b>${top.onRate}%</b>로 <b>+${top.delta}%p</b>. 의지가 아니라 조건의 문제다.`]);
      }
      const second = lev.levers[1];
      if (second) {
        out.push(['&#128200;', `두 번째 레버는 <b>${second.name}</b>: ${second.offLbl} ${second.offRate}% vs ${second.onLbl} <b>${second.onRate}%</b> (+${second.delta}%p).`]);
      }

      // 4. 약한 요일
      const dowLever = lev.levers.find(l => l.worstDow);
      if (dowLever) {
        out.push(['&#9888;&#65039;', `가장 무너지는 요일은 <b>${dowLever.worstDow}요일</b> (완료율 ${dowLever.worstRate}%). 그날은 계획을 줄이고 반드시 끝낼 것만 남겨라.`]);
      }

      // 5. 밀린 약속
      if (stalled.length > 0) {
        const z = stalled[0];
        out.push(['&#9203;', `<b>'${escapeHtml(z.name)}'</b>${josa(z.name, ['은', '는'])} ${z.misses}번 적고 ${z.ageDays}일째 못 끝냈다. 미루는 항목은 시간이 없는 게 아니라 결심이 없는 항목이다.`]);
      }

      // 6. A급 실행력
      const A = s.byPrio.A;
      if (A.t >= 3) {
        const aRate = rateOf(A);
        if (aRate >= s.rate + 10) out.push(['&#127919;', `A급 완료율 <b>${aRate}%</b> — 중요한 걸 먼저 끝낸다. 이 순서 감각은 유지하라.`]);
        else if (aRate < s.rate) out.push(['&#128680;', `A급 완료율이 <b>${aRate}%</b>로 전체(${s.rate}%)보다 낮다. 가장 중요한 일이 가장 먼저 밀리고 있다.`]);
      }

      // 7. 완주일 / 스트릭
      if (s.perfectDays > 0) {
        out.push(['&#10024;', `완주한 날 <b>${s.perfectDays}일</b>. 그날의 항목 수와 구성이 네 최적 하루다 — 복제하면 된다.`]);
      }
      if (streak.best > 0) {
        out.push(['&#128293;', `현재 연속 기록 <b>${streak.current}일</b> / 최장 <b>${streak.best}일</b> (최근 90일 기록률 ${streak.rate}%).`]);
      }

      return out;
    }

    // 처방: 이번 기간에 실제로 바꿀 행동 3개
    function buildPrescriptions(s, lev, stalled, streak) {
      const rx = [];

      // 1) 최대 레버를 규칙으로
      const timeLever = lev.levers.find(l => l.name === '시간을 적으면');
      const prioLever = lev.levers.find(l => l.name === '등급을 매기면');
      if (timeLever) {
        const cur = lev.withTime ? Math.round(lev.withTime.t / (lev.withTime.t + lev.noTime.t) * 100) : 0;
        rx.push(`매일 항목에 <b>마감시간을 적는다</b>. 지금 시간 지정 비율은 ${cur}% — 이걸 70%까지 올리면 완료율이 ${timeLever.offRate}%대에서 ${timeLever.onRate}%대로 간다. ("오전10시 지유병원"처럼 적으면 자동 인식)`);
      }
      if (prioLever && rx.length < 3) {
        const cur = lev.withPrio ? Math.round(lev.withPrio.t / (lev.withPrio.t + lev.noPrio.t) * 100) : 0;
        rx.push(`하루 <b>A급은 최대 2개</b>만 지정하고 그건 무조건 끝낸다. 등급 지정 항목은 ${prioLever.onRate}%, 미지정은 ${prioLever.offRate}% — 현재 지정 비율 ${cur}%.`);
      }

      // 2) 밀린 약속 청산
      if (stalled.length > 0) {
        const names = stalled.slice(0, 2).map(z => `'${escapeHtml(z.name)}'(${z.ageDays}일째)`).join(', ');
        rx.push(`<b>밀린 약속부터 청산</b>: ${names}. 아래 [오늘로] 버튼으로 오늘 목록에 A급으로 올리고, 시간까지 못 박아라. 못 할 일이면 목록에서 지워라 — 끌고 다니는 게 가장 비싸다.`);
      }

      // 3) 약한 요일 방어
      const dowLever = lev.levers.find(l => l.worstDow);
      if (dowLever && rx.length < 3) {
        rx.push(`<b>${dowLever.worstDow}요일 규칙</b>: 항목 3개 이하, 전부 시간 지정. 완료율 ${dowLever.worstRate}%인 날에 평소처럼 계획하는 건 실패를 예약하는 것이다.`);
      }

      // 4) 기록 스트릭
      const past = s.daily.filter(x => !x.isFuture).length;
      const missing = past - s.activeDays;
      if (rx.length < 3 && missing > 0) {
        rx.push(`<b>기록 공백 0일</b> 만들기. 바쁜 날은 3줄이라도 적는다. 현재 최장 연속 ${streak.best}일 — 이 기록을 깨는 게 이번 목표다.`);
      }

      // 5) 계획 분량 — 적게 적은 날이 무너지는 패턴이면 경고
      const sizeLever = lev.levers.find(l => l.name === '하루 계획 분량');
      if (rx.length < 3 && sizeLever) {
        rx.push(`<b>바쁘다고 계획을 줄이지 마라</b>. ${sizeLever.offLbl}만 적은 날 완료율은 ${sizeLever.offRate}%, ${sizeLever.onLbl} 적은 날은 ${sizeLever.onRate}%다. 적게 적은 날은 이미 마음이 놓인 날이다.`);
      }

      if (rx.length < 3) {
        rx.push(`가장 자주 놓친 항목에 <b>마감시간과 A급</b>을 붙여 다시 올려라. 같은 방식으로 다시 적으면 결과도 같다.`);
      }

      return rx.slice(0, 3);
    }

    // 복기 텍스트(복사/공유용) 생성
    function buildReviewText(label, diagnosis, prescriptions, quote) {
      const strip = (h) => String(h).replace(/<[^>]+>/g, '').replace(/&#\d+;/g, '').replace(/&nbsp;/g, ' ')
                                    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').trim();
      const lines = [];
      lines.push(`[새록 복기] ${label} (${statsMode === 'week' ? '주간' : '월간'})`);
      lines.push('');
      lines.push('# 진단');
      diagnosis.forEach(([, msg]) => lines.push('- ' + strip(msg)));
      lines.push('');
      lines.push('# 처방');
      prescriptions.forEach((p, i) => lines.push(`${i + 1}. ` + strip(p)));
      lines.push('');
      lines.push(strip(quote));
      return lines.join('\n');
