<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4A90D9">
  <title>일일 체크리스트</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root {
      --primary: #4A90D9;
      --primary-light: #6BA5E7;
      --primary-dark: #3A7BC8;
      --bg: #F5F7FA;
      --card: #FFFFFF;
      --text: #2C3E50;
      --text-light: #7F8C8D;
      --success: #27AE60;
      --danger: #E74C3C;
      --border: #E8ECF1;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --radius: 12px;
      --tab-height: 60px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 16px 20px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(74,144,217,0.3);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .header .date-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
    }

    .header .date-nav button {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header .date-nav button:active {
      background: rgba(255,255,255,0.35);
    }

    .header .date-nav .current-date {
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
    }

    /* Loading overlay */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .loading-overlay.active {
      display: flex;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Tab content */
    .tab-content {
      padding: 16px 16px calc(var(--tab-height) + var(--safe-bottom) + 16px);
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Bottom Tab Bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--tab-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--card);
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
      z-index: 100;
    }

    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 0;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-light);
      font-size: 11px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .tab-btn.active {
      color: var(--primary);
    }

    .tab-btn .tab-icon {
      font-size: 22px;
      line-height: 1;
    }

    /* Progress Bar */
    .progress-container {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .progress-info .label {
      font-size: 14px;
      font-weight: 600;
    }

    .progress-info .count {
      font-size: 13px;
      color: var(--text-light);
    }

    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      border-radius: 4px;
      transition: width 0.4s ease;
      width: 0%;
    }

    /* Monthly Plan Section */
    .monthly-plan-section {
      background: var(--card);
      border-radius: var(--radius);
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .monthly-plan-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
    }

    .monthly-plan-header:active {
      background: var(--bg);
    }

    .monthly-plan-header .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .monthly-plan-header .title {
      font-size: 14px;
      font-weight: 700;
    }

    .monthly-progress {
      font-size: 12px;
      background: var(--bg);
      color: var(--text-light);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .monthly-toggle {
      font-size: 12px;
      color: var(--text-light);
      transition: transform 0.2s;
    }

    .monthly-toggle.open {
      transform: rotate(180deg);
    }

    .monthly-plan-body {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
    }

    .monthly-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .monthly-item:last-of-type {
      border-bottom: none;
    }

    .monthly-item .checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .monthly-item.done .checkbox {
      background: var(--success);
      border-color: var(--success);
    }

    .monthly-item .checkbox::after {
      content: '';
      display: none;
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-top: -2px;
    }

    .monthly-item.done .checkbox::after {
      display: block;
    }

    .monthly-item .monthly-name {
      flex: 1;
      font-size: 14px;
    }

    .monthly-item.done .monthly-name {
      text-decoration: line-through;
      color: var(--text-light);
    }

    .monthly-item .delete-btn {
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      opacity: 0.5;
    }

    .monthly-item .delete-btn:active {
      opacity: 1;
      color: var(--danger);
    }

    .monthly-add-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .monthly-add-row input {
      flex: 1;
      padding: 8px 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .monthly-add-row input:focus {
      border-color: var(--primary);
    }

    .monthly-add-row button {
      padding: 8px 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Checklist */
    .checklist-section {
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      padding-left: 4px;
    }

    .checklist-item {
      background: var(--card);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow);
      transition: all 0.2s;
    }

    .checklist-item.done {
      opacity: 0.6;
    }

    .checklist-item .checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .checklist-item.done .checkbox {
      background: var(--success);
      border-color: var(--success);
    }

    .checklist-item .checkbox::after {
      content: '';
      display: none;
      width: 6px;
      height: 10px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-top: -2px;
    }

    .checklist-item.done .checkbox::after {
      display: block;
    }

    /* Priority Badge */
    .priority-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }

    .priority-badge.A { background: #E74C3C; }
    .priority-badge.B { background: #E67E22; }
    .priority-badge.C { background: #3498DB; }

    /* Item content */
    .item-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .checklist-item .item-name {
      font-size: 15px;
      font-weight: 500;
    }

    .checklist-item.done .item-name {
      text-decoration: line-through;
      color: var(--text-light);
    }

    .deadline-text {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 2px;
    }

    .deadline-text.overdue {
      color: var(--danger);
      font-weight: 600;
    }

    .checklist-item .delete-btn {
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      opacity: 0.5;
    }

    .checklist-item .delete-btn:active {
      opacity: 1;
      color: var(--danger);
    }

    /* Add Item (new multi-row UI) */
    .add-item-wrapper {
      margin-top: 16px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .add-item-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .add-item-row + .add-item-row {
      margin-top: 8px;
    }

    .add-item-row .text-input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      outline: none;
      background: var(--bg);
    }

    .add-item-row .text-input:focus {
      border-color: var(--primary);
      background: var(--card);
    }

    .time-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .time-group input[type="time"] {
      flex: 1;
      padding: 8px 10px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: var(--bg);
    }

    .time-group input[type="time"]:focus {
      border-color: var(--primary);
      background: var(--card);
    }

    .time-group .until-label {
      font-size: 13px;
      color: var(--text-light);
      white-space: nowrap;
    }

    .priority-group {
      display: flex;
      gap: 4px;
    }

    .priority-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-light);
      transition: all 0.15s;
    }

    .priority-btn[data-priority="A"].active { background: #E74C3C; border-color: #E74C3C; color: white; }
    .priority-btn[data-priority="B"].active { background: #E67E22; border-color: #E67E22; color: white; }
    .priority-btn[data-priority="C"].active { background: #3498DB; border-color: #3498DB; color: white; }

    .add-btn {
      padding: 8px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .add-btn:active {
      background: var(--primary-dark);
    }

    /* Stats Tab */
    .stats-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .period-toggle {
      display: flex;
      background: var(--card);
      border-radius: 10px;
      padding: 3px;
      box-shadow: var(--shadow);
    }

    .period-toggle button {
      border: none;
      background: none;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-light);
      cursor: pointer;
    }

    .period-toggle button.active {
      background: var(--primary);
      color: white;
    }

    .period-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border-radius: 10px;
      padding: 3px 6px;
      box-shadow: var(--shadow);
    }

    .period-nav button {
      border: none;
      background: none;
      font-size: 13px;
      padding: 6px 8px;
      color: var(--primary);
      cursor: pointer;
    }

    .period-nav .period-label {
      font-size: 13px;
      font-weight: 600;
      min-width: 96px;
      text-align: center;
    }

    .stat-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px 8px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-card .num {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }

    .stat-card .num.good { color: var(--success); }
    .stat-card .num.bad { color: var(--danger); }

    .stat-card .lbl {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 4px;
      font-weight: 600;
    }

    .stats-section {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .stats-section h3 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stats-section .sub-note {
      font-size: 11px;
      color: var(--text-light);
      font-weight: 400;
      margin-left: auto;
    }

    /* 우선순위/카테고리 가로 바 */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .bar-row .bar-name {
      width: 74px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-row .bar-track {
      flex: 1;
      height: 16px;
      background: var(--bg);
      border-radius: 8px;
      overflow: hidden;
    }

    .bar-row .bar-fill {
      height: 100%;
      border-radius: 8px;
      background: var(--primary);
      transition: width 0.4s ease;
    }

    .bar-row .bar-val {
      width: 78px;
      font-size: 11px;
      color: var(--text-light);
      text-align: right;
      flex-shrink: 0;
    }

    .prio-tag {
      display: inline-flex;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 11px;
      font-weight: 700;
      margin-right: 6px;
    }

    .prio-tag.A { background: var(--danger); }
    .prio-tag.B { background: #F39C12; }
    .prio-tag.C { background: var(--primary); }
    .prio-tag.N { background: #95A5A6; }

    /* 일별 추이 세로 바 차트 */
    .day-chart {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 90px;
      padding-top: 14px;
    }

    .day-chart .day-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      min-width: 0;
    }

    .day-chart .day-bar {
      width: 100%;
      max-width: 26px;
      border-radius: 4px 4px 0 0;
      background: var(--primary-light);
      min-height: 2px;
      position: relative;
    }

    .day-chart .day-bar.full { background: var(--success); }
    .day-chart .day-bar.zero { background: var(--border); }

    .day-chart .day-lbl {
      font-size: 9px;
      color: var(--text-light);
      margin-top: 4px;
      white-space: nowrap;
    }

    .day-chart .day-col.today-col .day-lbl {
      color: var(--primary);
      font-weight: 700;
    }

    /* 항목 리스트 (놓친/완료 TOP) */
    .rank-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .rank-item:last-child { border-bottom: none; }

    .rank-item .rank-no {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--bg);
      color: var(--text-light);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .rank-item .rank-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rank-item .rank-cnt {
      font-size: 12px;
      color: var(--text-light);
      flex-shrink: 0;
    }

    .rank-item .rank-cnt b { color: var(--text); }

    /* 인사이트 */
    .insight-item {
      display: flex;
      gap: 8px;
      padding: 8px 0;
      font-size: 13px;
      line-height: 1.55;
      border-bottom: 1px dashed var(--border);
    }

    .insight-item:last-child { border-bottom: none; }

    .insight-item .ico { flex-shrink: 0; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light);
    }

    .empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 14px;
    }

    /* Settings Tab */
    .settings-section {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .settings-section h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .api-url-input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      margin-top: 8px;
    }

    .api-url-input:focus {
      border-color: var(--primary);
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:active {
      background: var(--primary-dark);
    }

    .btn-outline {
      background: none;
      border: 2px solid var(--border);
      color: var(--text);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 13px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-badge.connected {
      background: #E8F8EF;
      color: var(--success);
    }

    .status-badge.disconnected {
      background: #FDE8E8;
      color: var(--danger);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: calc(var(--tab-height) + var(--safe-bottom) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text);
      color: white;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      z-index: 200;
      opacity: 0;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1 id="headerTitle">오늘의 체크리스트</h1>
    <div class="date-nav" id="dateNav">
      <button onclick="changeDate(-1)">&#9664;</button>
      <span class="current-date" id="currentDate" onclick="goToday()"></span>
      <button onclick="changeDate(1)">&#9654;</button>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
  </div>

  <!-- Tab 1: Checklist -->
  <div class="tab-content active" id="tab-checklist">
    <!-- Progress -->
    <div class="progress-container">
      <div class="progress-info">
        <span class="label">오늘의 달성률</span>
        <span class="count" id="progressCount">0/0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Monthly Plan -->
    <div class="monthly-plan-section">
      <div class="monthly-plan-header" onclick="toggleMonthlySection()">
        <div class="header-left">
          <span class="title">월 계획</span>
          <span class="monthly-progress" id="monthlyProgress">0/0</span>
        </div>
        <span class="monthly-toggle" id="monthlyToggle">&#9660;</span>
      </div>
      <div class="monthly-plan-body" id="monthlyPlanBody" style="display:none;">
        <div id="monthlyItems"></div>
        <div class="monthly-add-row">
          <input type="text" id="newMonthlyItemInput" placeholder="월 계획 항목 추가..."
                 onkeydown="if(event.key==='Enter')addMonthlyItem()">
          <button onclick="addMonthlyItem()">추가</button>
        </div>
      </div>
    </div>

    <!-- Additional items -->
    <div class="checklist-section">
      <div class="section-title">체크리스트</div>
      <div id="additionalItems"></div>
    </div>

    <!-- Add new (multi-row UI) -->
    <div class="add-item-wrapper">
      <div class="add-item-row">
        <input type="text" class="text-input" id="newItemInput" placeholder="새 항목 추가..."
               onkeydown="if(event.key==='Enter')addItem()">
      </div>
      <div class="add-item-row">
        <div class="time-group">
          <input type="time" id="newItemDeadline">
          <span class="until-label">까지</span>
        </div>
        <div class="priority-group">
          <button class="priority-btn" data-priority="A" onclick="togglePriority('A')">A</button>
          <button class="priority-btn" data-priority="B" onclick="togglePriority('B')">B</button>
          <button class="priority-btn" data-priority="C" onclick="togglePriority('C')">C</button>
        </div>
        <button class="add-btn" onclick="addItem()">추가</button>
      </div>
    </div>
  </div>

  <!-- Tab 2: Stats -->
  <div class="tab-content" id="tab-stats">
    <!-- 기간 선택 -->
    <div class="stats-toolbar">
      <div class="period-toggle">
        <button id="modeWeek" class="active" onclick="setStatsMode('week')">주간</button>
        <button id="modeMonth" onclick="setStatsMode('month')">월간</button>
      </div>
      <div class="period-nav">
        <button onclick="moveStatsPeriod(-1)">&#9664;</button>
        <span class="period-label" id="statsPeriodLabel"></span>
        <button onclick="moveStatsPeriod(1)">&#9654;</button>
      </div>
    </div>

    <div id="statsBody"></div>
  </div>

  <!-- Tab 3: Settings -->
  <div class="tab-content" id="tab-settings">
    <!-- API URL -->
    <div class="settings-section">
      <h3>Google Apps Script 연결</h3>
      <p style="font-size:13px;color:var(--text-light);margin-bottom:8px;">
        배포된 웹앱 URL을 입력하세요
      </p>
      <input type="url" class="api-url-input" id="apiUrlInput"
             placeholder="https://script.google.com/macros/s/...">
      <div style="display:flex;gap:8px;margin-top:12px;align-items:center;">
        <button class="btn btn-primary btn-sm" onclick="saveApiUrl()">저장</button>
        <button class="btn btn-outline btn-sm" onclick="testConnection()">연결 테스트</button>
        <span class="status-badge disconnected" id="connectionStatus">미연결</span>
      </div>
    </div>

    <!-- App Info -->
    <div class="settings-section" style="text-align:center;">
      <p style="font-size:13px;color:var(--text-light);">일일 체크리스트 v3.0 (통계 분석)</p>
      <p style="font-size:12px;color:var(--text-light);margin-top:4px;">PWA - 오프라인 지원</p>
    </div>
  </div>

  <!-- Tab Bar -->
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('checklist', this)">
      <span class="tab-icon">&#9745;</span>
      <span>체크리스트</span>
    </button>
    <button class="tab-btn" onclick="switchTab('stats', this)">
      <span class="tab-icon">&#128202;</span>
      <span>통계</span>
    </button>
    <button class="tab-btn" onclick="switchTab('settings', this)">
      <span class="tab-icon">&#9881;</span>
      <span>설정</span>
    </button>
  </nav>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ==========================================
    // State
    // ==========================================
    let currentDate = new Date();
    let checklistItems = [];
    let monthlyPlanItems = [];
    let selectedPriority = null;
    let statsMode = 'week';          // 'week' | 'month'
    let statsAnchor = new Date();    // 통계 기간 기준일

    const API_URL_KEY = 'daily_app_api_url';
    const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbz5oYnYCxLW_8sYMumq8_9JUKufIKeCOmKNgFII8RMuX3WOCYoNTh07-U4UeT8bwfoo-g/exec';
    const LOCAL_DATA_PREFIX = 'daily_checklist_';
    const MONTHLY_PLAN_PREFIX = 'monthly_plan_';

    // ==========================================
    // Initialization
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      // 항상 최신 URL로 강제 업데이트
      localStorage.setItem(API_URL_KEY, DEFAULT_API_URL);
      document.getElementById('apiUrlInput').value = DEFAULT_API_URL;

      updateDateDisplay();
      loadChecklist();
      loadMonthlyPlan();
      registerServiceWorker();
    });

    function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    }

    // ==========================================
    // Tab Navigation
    // ==========================================
    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById('tab-' + tab).classList.add('active');
      btn.classList.add('active');

      if (tab === 'checklist') {
        document.getElementById('headerTitle').textContent = '오늘의 체크리스트';
        document.getElementById('dateNav').style.display = 'flex';
      } else if (tab === 'stats') {
        document.getElementById('headerTitle').textContent = '통계 분석';
        document.getElementById('dateNav').style.display = 'none';
        loadStats();
      } else {
        document.getElementById('headerTitle').textContent = '설정';
        document.getElementById('dateNav').style.display = 'none';
        updateConnectionStatus();
      }
    }

    // ==========================================
    // Date Navigation
    // ==========================================
    function formatDate(d) {
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function formatDisplayDate(d) {
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const m = d.getMonth() + 1;
      const day = d.getDate();
      const dow = days[d.getDay()];
      return `${m}월 ${day}일 (${dow})`;
    }

    function getYearMonth() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }

    function updateDateDisplay() {
      const today = new Date();
      const dateStr = formatDisplayDate(currentDate);
      const isToday = formatDate(currentDate) === formatDate(today);
      document.getElementById('currentDate').textContent = isToday ? `오늘 - ${dateStr}` : dateStr;
    }

    function changeDate(delta) {
      currentDate.setDate(currentDate.getDate() + delta);
      updateDateDisplay();
      loadChecklist();
    }

    function goToday() {
      currentDate = new Date();
      updateDateDisplay();
      loadChecklist();
    }

    // ==========================================
    // API Helpers
    // ==========================================
    function getApiUrl() {
      return localStorage.getItem(API_URL_KEY) || '';
    }

    async function apiGet(action, params = {}) {
      const url = getApiUrl();
      if (!url) return null;

      // items 배열은 JSON 문자열로 변환
      const flatParams = {};
      for (const [k, v] of Object.entries({ action, ...params })) {
        flatParams[k] = typeof v === 'object' ? JSON.stringify(v) : v;
      }
      const queryStr = new URLSearchParams(flatParams).toString();
      try {
        const resp = await fetch(`${url}?${queryStr}`, { redirect: 'follow' });
        return await resp.json();
      } catch (e) {
        console.error('API GET error:', e);
        return null;
      }
    }

    async function apiPost(data) {
      // GET 방식으로 저장 (POST CORS 문제 우회)
      return await apiGet(data.action, data);
    }

    function showLoading(show) {
      document.getElementById('loading').classList.toggle('active', show);
    }

    // ==========================================
    // Monthly Plan Logic
    // ==========================================
    async function loadMonthlyPlan() {
      const ym = getYearMonth();

      if (getApiUrl()) {
        const data = await apiGet('getMonthlyPlan', { yearMonth: ym });
        if (data && !data.error) {
          const remoteItems = data.items || [];
          const localRaw = localStorage.getItem(MONTHLY_PLAN_PREFIX + ym);
          const localItems = localRaw ? JSON.parse(localRaw) : [];
          // 원격 데이터가 있으면 사용, 없으면 로컬 유지
          if (remoteItems.length > 0 || localItems.length === 0) {
            monthlyPlanItems = remoteItems;
            localStorage.setItem(MONTHLY_PLAN_PREFIX + ym, JSON.stringify(monthlyPlanItems));
          } else {
            monthlyPlanItems = localItems;
          }
          renderMonthlyPlan();
          return;
        }
      }

      const local = localStorage.getItem(MONTHLY_PLAN_PREFIX + ym);
      monthlyPlanItems = local ? JSON.parse(local) : [];
      renderMonthlyPlan();
    }

    function saveMonthlyPlanData() {
      const ym = getYearMonth();
      localStorage.setItem(MONTHLY_PLAN_PREFIX + ym, JSON.stringify(monthlyPlanItems));

      if (getApiUrl()) {
        apiPost({ action: 'saveMonthlyPlan', yearMonth: ym, items: monthlyPlanItems });
      }
    }

    function toggleMonthlySection() {
      const body = document.getElementById('monthlyPlanBody');
      const toggle = document.getElementById('monthlyToggle');
      const isOpen = body.style.display !== 'none';
      body.style.display = isOpen ? 'none' : 'block';
      toggle.classList.toggle('open', !isOpen);
    }

    function renderMonthlyPlan() {
      const done = monthlyPlanItems.filter(i => i.done).length;
      const total = monthlyPlanItems.length;
      document.getElementById('monthlyProgress').textContent = `${done}/${total}`;

      const container = document.getElementById('monthlyItems');
      if (monthlyPlanItems.length === 0) {
        container.innerHTML = '<div style="padding:8px 0;color:var(--text-light);font-size:13px;">월 계획 항목이 없습니다</div>';
        return;
      }

      container.innerHTML = monthlyPlanItems.map(item => `
        <div class="monthly-item ${item.done ? 'done' : ''}">
          <div class="checkbox" onclick="toggleMonthlyItem('${item.id}')"></div>
          <span class="monthly-name">${escapeHtml(item.name)}</span>
          <button class="delete-btn" onclick="deleteMonthlyItem('${item.id}')">&times;</button>
        </div>
      `).join('');
    }

    function toggleMonthlyItem(id) {
      const item = monthlyPlanItems.find(i => i.id === id);
      if (!item) return;
      item.done = !item.done;
      saveMonthlyPlanData();
      renderMonthlyPlan();
    }

    function deleteMonthlyItem(id) {
      monthlyPlanItems = monthlyPlanItems.filter(i => i.id !== id);
      saveMonthlyPlanData();
      renderMonthlyPlan();
    }

    function addMonthlyItem() {
      const input = document.getElementById('newMonthlyItemInput');
      const name = input.value.trim();
      if (!name) return;

      monthlyPlanItems.push({
        id: 'm' + Date.now(),
        name: name,
        done: false,
        order: monthlyPlanItems.length + 1
      });

      input.value = '';
      saveMonthlyPlanData();
      renderMonthlyPlan();
      showToast('월 계획 항목 추가됨');
    }

    // ==========================================
    // Priority Toggle
    // ==========================================
    function togglePriority(p) {
      selectedPriority = selectedPriority === p ? null : p;
      document.querySelectorAll('.priority-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.priority === selectedPriority);
      });
    }

    // ==========================================
    // Checklist Logic
    // ==========================================
    async function loadChecklist() {
      const dateStr = formatDate(currentDate);

      if (getApiUrl()) {
        showLoading(true);
        const data = await apiGet('getChecklist', { date: dateStr });
        showLoading(false);

        if (data && !data.error) {
          const remoteItems = data.items || [];
          const localItems = loadLocalChecklist(dateStr) || [];
          // 원격 데이터가 있으면 사용, 없으면 로컬 유지
          if (remoteItems.length > 0 || localItems.length === 0) {
            checklistItems = remoteItems;
            saveLocalChecklist(dateStr, checklistItems);
          } else {
            checklistItems = localItems;
          }
          renderChecklist();
          return;
        }
      }

      const local = loadLocalChecklist(dateStr);
      checklistItems = local || [];
      renderChecklist();
    }

    function renderChecklist() {
      const priorityOrder = { A: 1, B: 2, C: 3 };
      const sorted = [...checklistItems].sort((a, b) => {
        const pa = priorityOrder[a.priority] || 4;
        const pb = priorityOrder[b.priority] || 4;
        if (pa !== pb) return pa - pb;
        return (a.order || 0) - (b.order || 0);
      });

      const container = document.getElementById('additionalItems');
      container.innerHTML = sorted.length > 0
        ? sorted.map(item => renderItem(item)).join('')
        : '<div style="padding:8px;color:var(--text-light);font-size:13px;">항목 없음 - 아래에서 추가하세요</div>';

      updateProgress();
    }

    function renderItem(item) {
      const priorityBadge = item.priority
        ? `<span class="priority-badge ${item.priority}">${item.priority}</span>`
        : '';

      let deadlineHtml = '';
      if (item.deadline) {
        const isOverdue = isDeadlineOverdue(item);
        const displayTime = formatDeadlineDisplay(item.deadline);
        deadlineHtml = `<div class="deadline-text ${isOverdue ? 'overdue' : ''}">${displayTime}까지</div>`;
      }

      return `
        <div class="checklist-item ${item.done ? 'done' : ''}" data-id="${item.id}">
          <div class="checkbox" onclick="toggleItem('${item.id}')"></div>
          ${priorityBadge}
          <div class="item-content">
            <span class="item-name">${escapeHtml(item.name)}</span>
            ${deadlineHtml}
          </div>
          <button class="delete-btn" onclick="deleteItem('${item.id}')">&times;</button>
        </div>
      `;
    }

    function isDeadlineOverdue(item) {
      if (!item.deadline) return false;
      const today = formatDate(new Date());
      const dateStr = formatDate(currentDate);
      if (dateStr !== today) return false;

      const now = new Date();
      const [h, m] = item.deadline.split(':').map(Number);
      return now.getHours() > h || (now.getHours() === h && now.getMinutes() > m);
    }

    function formatDeadlineDisplay(timeStr) {
      if (!timeStr) return '';
      let h, m;
      // ISO 날짜 문자열인 경우 (구글 시트 자동 변환)
      if (typeof timeStr === 'string' && (timeStr.includes('T') || timeStr.includes('-'))) {
        const d = new Date(timeStr);
        if (!isNaN(d.getTime())) { h = d.getHours(); m = d.getMinutes(); }
      } else {
        const parts = String(timeStr).split(':');
        h = parseInt(parts[0], 10);
        m = parseInt(parts[1], 10);
      }
      if (isNaN(h) || isNaN(m)) return String(timeStr);
      const period = h < 12 ? '오전' : '오후';
      const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
      return `${period} ${h12}:${String(m).padStart(2, '0')}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function updateProgress() {
      const total = checklistItems.length;
      const done = checklistItems.filter(i => i.done).length;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;

      document.getElementById('progressCount').textContent = `${done}/${total}`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    async function toggleItem(id) {
      const item = checklistItems.find(i => i.id === id);
      if (!item) return;

      item.done = !item.done;
      renderChecklist();
      await saveChecklist();
    }

    async function deleteItem(id) {
      checklistItems = checklistItems.filter(i => i.id !== id);
      renderChecklist();
      await saveChecklist();
    }

    async function addItem() {
      const input = document.getElementById('newItemInput');
      const name = input.value.trim();
      if (!name) return;

      const deadlineInput = document.getElementById('newItemDeadline');
      const deadline = deadlineInput.value || null;

      const maxOrder = checklistItems.reduce((max, i) => Math.max(max, i.order || 0), 0);
      checklistItems.push({
        name: name,
        done: false,
        type: '추가',
        order: maxOrder + 1,
        id: 'a' + Date.now(),
        deadline: deadline,
        priority: selectedPriority
      });

      input.value = '';
      deadlineInput.value = '';
      selectedPriority = null;
      document.querySelectorAll('.priority-btn').forEach(btn => btn.classList.remove('active'));

      renderChecklist();
      await saveChecklist();
      showToast('항목 추가됨');
    }

    async function saveChecklist() {
      const dateStr = formatDate(currentDate);
      saveLocalChecklist(dateStr, checklistItems);

      if (getApiUrl()) {
        const result = await apiPost({
          action: 'saveChecklist',
          date: dateStr,
          items: checklistItems
        });
        if (!result) showToast('⚠️ 서버 저장 실패 (로컬에는 저장됨)');
      }
    }

    function saveLocalChecklist(dateStr, items) {
      localStorage.setItem(LOCAL_DATA_PREFIX + dateStr, JSON.stringify(items));
    }

    function loadLocalChecklist(dateStr) {
      const data = localStorage.getItem(LOCAL_DATA_PREFIX + dateStr);
      return data ? JSON.parse(data) : null;
    }

    // ==========================================
    // Stats Logic (통계 분석)
    // ==========================================
    // 업무 거래처 감지 (병원/약국 등)
    const WORK_PLACE_RE = /(병원|의원|약국|클리닉|내과|외과|정형|이비인후|소아과|피부과|비뇨|산부인과|안과|치과|한의원|보건소|메디컬|온누리)/;

    // 생활 카테고리 (먼저 매칭되는 순서대로 분류)
    const CATEGORIES = [
      { key: '업무',     re: /(병원|의원|약국|클리닉|내과|외과|정형|이비인후|소아과|피부과|비뇨|산부인과|안과|치과|한의원|보건소|메디컬|온누리|방명록|경비|실적|보고|미팅|회의|디테일|심포지|거래처|입력|결재|제출|발주|영업|지점|콜)/ },
      { key: '건강/운동', re: /(운동|헬스|러닝|달리기|조깅|산책|걷기|스트레칭|요가|홈트|푸시업|스쿼트|금주|다이어트|체중|영양제|물\s*마시기|수면|일찍)/ },
      { key: '자기계발',  re: /(공부|독서|책|강의|영어|학습|블로그|유튜브|글쓰기|자격증|코딩|명상|일기)/ },
      { key: '재테크',    re: /(주식|투자|매수|매도|SOXL|soxl|적금|연금|리밸런싱|증권|코인|배당)/ },
      { key: '가족/생활', re: /(가족|아내|와이프|아이|아들|딸|부모|어머니|아버지|장보기|청소|빨래|집안일|요리|설거지|은행|택배|미용실|세차|이사|선물|생일)/ }
    ];

    function categorize(name) {
      for (const c of CATEGORIES) {
        if (c.re.test(name)) return c.key;
      }
      return '기타';
    }

    function setStatsMode(mode) {
      statsMode = mode;
      statsAnchor = new Date();
      document.getElementById('modeWeek').classList.toggle('active', mode === 'week');
      document.getElementById('modeMonth').classList.toggle('active', mode === 'month');
      loadStats();
    }

    function moveStatsPeriod(delta) {
      if (statsMode === 'week') {
        statsAnchor.setDate(statsAnchor.getDate() + delta * 7);
      } else {
        statsAnchor.setDate(1); // 말일 넘김 방지
        statsAnchor.setMonth(statsAnchor.getMonth() + delta);
      }
      loadStats();
    }

    // 기간의 날짜 목록 + 라벨
    function getStatsRange() {
      const dates = [];
      let label = '';
      if (statsMode === 'week') {
        const sunday = new Date(statsAnchor);
        sunday.setDate(sunday.getDate() - sunday.getDay());
        for (let i = 0; i < 7; i++) {
          const d = new Date(sunday);
          d.setDate(sunday.getDate() + i);
          dates.push(formatDate(d));
        }
        const end = new Date(sunday);
        end.setDate(sunday.getDate() + 6);
        label = `${sunday.getMonth() + 1}.${sunday.getDate()} ~ ${end.getMonth() + 1}.${end.getDate()}`;
      } else {
        const y = statsAnchor.getFullYear();
        const m = statsAnchor.getMonth();
        const lastDay = new Date(y, m + 1, 0).getDate();
        for (let i = 1; i <= lastDay; i++) {
          dates.push(formatDate(new Date(y, m, i)));
        }
        label = `${y}년 ${m + 1}월`;
      }
      return { dates, label };
    }

    // 기간 데이터 수집: 신규 range API → (구버전 폴백) 날짜별 조회 → 로컬
    async function fetchRangeItems(dates) {
      const days = {};
      if (getApiUrl()) {
        const data = await apiGet('getChecklistRange', { start: dates[0], end: dates[dates.length - 1] });
        if (data && !data.error && data.days) return data.days;

        // Apps Script가 구버전이면 날짜별 개별 조회로 폴백
        const results = await Promise.all(dates.map(d => apiGet('getChecklist', { date: d })));
        dates.forEach((d, i) => {
          const r = results[i];
          if (r && !r.error && r.items && r.items.length > 0) {
            days[d] = r.items;
          } else {
            const loc = loadLocalChecklist(d);
            if (loc && loc.length > 0) days[d] = loc;
          }
        });
        return days;
      }
      // 오프라인: 로컬 데이터만
      dates.forEach(d => {
        const loc = loadLocalChecklist(d);
        if (loc && loc.length > 0) days[d] = loc;
      });
      return days;
    }

    async function loadStats() {
      const { dates, label } = getStatsRange();
      document.getElementById('statsPeriodLabel').textContent = label;

      showLoading(true);
      const days = await fetchRangeItems(dates);
      showLoading(false);

      renderStats(dates, days);
    }

    function analyzeStats(dates, days) {
      const todayStr = formatDate(new Date());
      const flat = [];
      dates.forEach(d => (days[d] || []).forEach(it => flat.push({ ...it, date: d })));

      const total = flat.length;
      const done = flat.filter(i => i.done).length;
      const rate = total > 0 ? Math.round(done / total * 100) : 0;

      // 우선순위별
      const byPrio = { A: { t: 0, d: 0 }, B: { t: 0, d: 0 }, C: { t: 0, d: 0 }, N: { t: 0, d: 0 } };
      flat.forEach(i => {
        const p = byPrio[i.priority] ? i.priority : 'N';
        byPrio[p].t++;
        if (i.done) byPrio[p].d++;
      });

      // 일별 추이
      const daily = dates.map(d => {
        const items = days[d] || [];
        const t = items.length;
        const dn = items.filter(i => i.done).length;
        return { date: d, t, d: dn, rate: t > 0 ? dn / t : null, isToday: d === todayStr, isFuture: d > todayStr };
      });

      const activeDays = daily.filter(x => x.t > 0).length;
      const perfectDays = daily.filter(x => x.t > 0 && x.d === x.t).length;

      // 항목명별 집계 (놓친/완료 TOP)
      const missMap = {}, doneMap = {};
      flat.forEach(i => {
        const key = String(i.name).trim();
        if (!key) return;
        // 미래 날짜의 미완료는 '놓친 것'이 아님
        if (i.done) doneMap[key] = (doneMap[key] || 0) + 1;
        else if (i.date <= todayStr) missMap[key] = (missMap[key] || 0) + 1;
      });
      const topMissed = Object.entries(missMap).sort((a, b) => b[1] - a[1]).slice(0, 5);
      const topDone = Object.entries(doneMap).sort((a, b) => b[1] - a[1]).slice(0, 5);

      // 업무 거래처 (병원/약국)
      const workItems = flat.filter(i => WORK_PLACE_RE.test(String(i.name)));
      const workDone = workItems.filter(i => i.done).length;
      const placeMap = {};
      workItems.forEach(i => {
        const key = String(i.name).trim();
        if (!placeMap[key]) placeMap[key] = { t: 0, d: 0 };
        placeMap[key].t++;
        if (i.done) placeMap[key].d++;
      });
      const topPlaces = Object.entries(placeMap).sort((a, b) => b[1].t - a[1].t).slice(0, 7);

      // 카테고리별
      const catMap = {};
      flat.forEach(i => {
        const c = categorize(String(i.name));
        if (!catMap[c]) catMap[c] = { t: 0, d: 0 };
        catMap[c].t++;
        if (i.done) catMap[c].d++;
      });
      const catList = Object.entries(catMap).sort((a, b) => b[1].t - a[1].t);

      // 요일별 달성률 (2일 이상 데이터가 있을 때만 의미)
      const dowNames = ['일', '월', '화', '수', '목', '금', '토'];
      const dowMap = {};
      daily.forEach(x => {
        if (x.t === 0) return;
        const dow = new Date(x.date + 'T00:00:00').getDay();
        if (!dowMap[dow]) dowMap[dow] = { t: 0, d: 0, days: 0 };
        dowMap[dow].t += x.t;
        dowMap[dow].d += x.d;
        dowMap[dow].days++;
      });

      // 마감시간 패턴 (완료 항목의 마감시각 평균)
      const deadlineHours = flat
        .filter(i => i.done && i.deadline)
        .map(i => {
          const s = String(i.deadline);
          const m = s.match(/(\d{1,2}):(\d{2})/);
          return m ? parseInt(m[1], 10) : null;
        })
        .filter(h => h !== null);

      return { total, done, rate, byPrio, daily, activeDays, perfectDays,
               topMissed, topDone, workItems, workDone, topPlaces,
               catList, dowMap, dowNames, deadlineHours };
    }

    function buildInsights(s) {
      const out = [];
      if (s.total === 0) return out;

      // 1. 전체 달성률 평가
      if (s.rate >= 80) {
        out.push(['&#127942;', `달성률 <b>${s.rate}%</b> — 계획한 일을 거의 다 해내고 있어요. 최상위권 실행력입니다.`]);
      } else if (s.rate >= 60) {
        out.push(['&#128170;', `달성률 <b>${s.rate}%</b> — 안정적으로 소화하고 있어요. 놓친 항목만 줄이면 완벽합니다.`]);
      } else if (s.rate >= 40) {
        out.push(['&#127793;', `달성률 <b>${s.rate}%</b> — 계획 대비 실행이 절반 수준이에요. 항목 수를 줄여 확실히 끝내는 전략도 좋아요.`]);
      } else {
        out.push(['&#128161;', `달성률 <b>${s.rate}%</b> — 계획이 실행보다 큰 시기예요. 하루 3개 이하 핵심 항목부터 다시 시작해보세요.`]);
      }

      // 2. 우선순위 스타일
      const A = s.byPrio.A, prioSum = s.byPrio.A.t + s.byPrio.B.t + s.byPrio.C.t;
      if (A.t >= 3) {
        const aRate = Math.round(A.d / A.t * 100);
        if (aRate >= s.rate + 10) {
          out.push(['&#127919;', `A급 완료율 <b>${aRate}%</b> — 중요한 일부터 확실히 끝내는 스타일이에요. 우선순위 감각이 좋습니다.`]);
        } else if (aRate <= s.rate - 15) {
          out.push(['&#9888;&#65039;', `A급 완료율이 <b>${aRate}%</b>로 전체 평균보다 낮아요. 가장 중요한 일이 자주 밀리고 있으니 하루의 첫 일정으로 배치해보세요.`]);
        }
      }
      if (prioSum === 0 && s.total >= 5) {
        out.push(['&#128204;', `우선순위(A/B/C)를 지정한 항목이 없어요. A만이라도 표시하면 복기 정확도가 확 올라갑니다.`]);
      }

      // 3. 삶의 중심 카테고리
      const topCat = s.catList.filter(c => c[0] !== '기타').sort((a, b) => b[1].d - a[1].d)[0];
      if (topCat && topCat[1].d >= 3) {
        const msgs = {
          '업무': '완료한 일의 중심이 <b>업무</b>예요. 영업 루틴이 삶의 엔진으로 돌아가고 있습니다.',
          '건강/운동': '완료한 일의 중심이 <b>건강/운동</b>이에요. 몸을 챙기는 사람이 결국 오래 이깁니다.',
          '자기계발': '완료한 일의 중심이 <b>자기계발</b>이에요. 꾸준히 쌓이는 것들이 미래의 무기가 됩니다.',
          '재테크': '완료한 일의 중심이 <b>재테크</b>예요. 돈이 일하게 만드는 습관을 만들고 있네요.',
          '가족/생활': '완료한 일의 중심이 <b>가족/생활</b>이에요. 삶의 기반을 단단히 다지는 시기네요.'
        };
        out.push(['&#129517;', msgs[topCat[0]] || `완료한 일의 중심이 <b>${topCat[0]}</b>이에요.`]);
      }

      // 4. 강한 요일
      const dowEntries = Object.entries(s.dowMap).filter(([, v]) => v.t >= 2);
      if (dowEntries.length >= 3) {
        const best = dowEntries.sort((a, b) => (b[1].d / b[1].t) - (a[1].d / a[1].t))[0];
        const bestRate = Math.round(best[1].d / best[1].t * 100);
        if (bestRate >= 60) {
          out.push(['&#128197;', `<b>${s.dowNames[best[0]]}요일</b>이 가장 강해요 (달성률 ${bestRate}%). 어려운 일은 이 요일에 배치해보세요.`]);
        }
      }

      // 5. 시간대 패턴
      if (s.deadlineHours.length >= 3) {
        const avg = s.deadlineHours.reduce((a, b) => a + b, 0) / s.deadlineHours.length;
        if (avg < 12) {
          out.push(['&#127749;', `완료한 일의 마감이 주로 <b>오전</b>이에요. 아침에 승부를 보는 타입 — 오전 집중력을 계속 활용하세요.`]);
        } else if (avg >= 15) {
          out.push(['&#127769;', `완료한 일의 마감이 주로 <b>오후~저녁</b>이에요. 후반 몰입형이니 오전엔 가벼운 일, 오후에 핵심 일정을 두는 게 맞아요.`]);
        }
      }

      // 6. 100% 달성일
      if (s.perfectDays >= 2) {
        out.push(['&#10024;', `이 기간 <b>100% 달성일이 ${s.perfectDays}일</b>! 완벽한 하루의 감각을 이미 알고 있어요. 그 날의 항목 수와 구성을 복제하세요.`]);
      }

      // 7. 자주 놓친 항목 처방
      if (s.topMissed.length > 0 && s.topMissed[0][1] >= 2) {
        out.push(['&#128269;', `가장 자주 놓친 항목은 <b>'${escapeHtml(s.topMissed[0][0])}'</b> (${s.topMissed[0][1]}회). 마감시간을 앞당기거나 우선순위를 한 단계 올려보세요.`]);
      }

      return out;
    }

    function renderStats(dates, days) {
      const s = analyzeStats(dates, days);
      const body = document.getElementById('statsBody');

      if (s.total === 0) {
        body.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">&#128202;</div>
            <p>이 기간에 기록된 항목이 없어요</p>
            <p style="margin-top:4px;font-size:12px;">체크리스트를 작성하면 통계가 쌓입니다</p>
          </div>`;
        return;
      }

      // 1) 요약 카드
      const rateClass = s.rate >= 70 ? 'good' : s.rate < 40 ? 'bad' : '';
      let html = `
        <div class="stat-cards">
          <div class="stat-card"><div class="num ${rateClass}">${s.rate}%</div><div class="lbl">달성률</div></div>
          <div class="stat-card"><div class="num good">${s.done}</div><div class="lbl">완료</div></div>
          <div class="stat-card"><div class="num bad">${s.total - s.done}</div><div class="lbl">미완료</div></div>
        </div>`;

      // 2) 일별 추이
      const isWeek = statsMode === 'week';
      html += `
        <div class="stats-section">
          <h3>&#128200; 일별 달성 추이 <span class="sub-note">기록 ${s.activeDays}일 / 100%달성 ${s.perfectDays}일</span></h3>
          <div class="day-chart">
            ${s.daily.map(x => {
              const pct = x.rate === null ? 0 : Math.max(x.rate * 100, 4);
              const cls = x.t === 0 ? 'zero' : (x.d === x.t ? 'full' : '');
              const d = new Date(x.date + 'T00:00:00');
              const lbl = isWeek ? s.dowNames[d.getDay()] : (d.getDate() % 5 === 0 || d.getDate() === 1 ? d.getDate() : '');
              return `<div class="day-col ${x.isToday ? 'today-col' : ''}">
                        <div class="day-bar ${cls}" style="height:${x.t === 0 ? 2 : pct}%" title="${x.date}: ${x.d}/${x.t}"></div>
                        <div class="day-lbl">${lbl}</div>
                      </div>`;
            }).join('')}
          </div>
        </div>`;

      // 3) 우선순위별
      const prioRows = [['A', 'A급 (중요)'], ['B', 'B급'], ['C', 'C급'], ['N', '미지정']]
        .filter(([k]) => s.byPrio[k].t > 0)
        .map(([k, name]) => {
          const p = s.byPrio[k];
          const r = Math.round(p.d / p.t * 100);
          return `<div class="bar-row">
                    <span class="bar-name"><span class="prio-tag ${k}">${k === 'N' ? '-' : k}</span></span>
                    <div class="bar-track"><div class="bar-fill" style="width:${r}%"></div></div>
                    <span class="bar-val">${p.d}/${p.t} (${r}%)</span>
                  </div>`;
        }).join('');
      html += `
        <div class="stats-section">
          <h3>&#127919; 우선순위별 분석</h3>
          ${prioRows}
        </div>`;

      // 4) 업무 거래처 (병원/약국)
      if (s.workItems.length > 0) {
        const wRate = Math.round(s.workDone / s.workItems.length * 100);
        html += `
          <div class="stats-section">
            <h3>&#127973; 업무 거래처 활동 <span class="sub-note">${s.workDone}/${s.workItems.length}건 완료 (${wRate}%)</span></h3>
            ${s.topPlaces.map(([name, v], i) => `
              <div class="rank-item">
                <span class="rank-no">${i + 1}</span>
                <span class="rank-name">${escapeHtml(name)}</span>
                <span class="rank-cnt"><b>${v.d}</b>/${v.t}회</span>
              </div>`).join('')}
          </div>`;
      }

      // 5) 자주 놓친 항목
      if (s.topMissed.length > 0) {
        html += `
          <div class="stats-section">
            <h3>&#128683; 자주 놓친 항목</h3>
            ${s.topMissed.map(([name, cnt], i) => `
              <div class="rank-item">
                <span class="rank-no">${i + 1}</span>
                <span class="rank-name">${escapeHtml(name)}</span>
                <span class="rank-cnt"><b>${cnt}</b>회 미완료</span>
              </div>`).join('')}
          </div>`;
      }

      // 6) 많이 완료한 항목
      if (s.topDone.length > 0) {
        html += `
          <div class="stats-section">
            <h3>&#9989; 꾸준히 완료한 항목</h3>
            ${s.topDone.map(([name, cnt], i) => `
              <div class="rank-item">
                <span class="rank-no">${i + 1}</span>
                <span class="rank-name">${escapeHtml(name)}</span>
                <span class="rank-cnt"><b>${cnt}</b>회 완료</span>
              </div>`).join('')}
          </div>`;
      }

      // 7) 생활 영역 분석
      if (s.catList.length > 0) {
        html += `
          <div class="stats-section">
            <h3>&#129517; 생활 영역 분석 <span class="sub-note">항목명 기반 자동 분류</span></h3>
            ${s.catList.map(([name, v]) => {
              const r = Math.round(v.d / v.t * 100);
              return `<div class="bar-row">
                        <span class="bar-name">${escapeHtml(name)}</span>
                        <div class="bar-track"><div class="bar-fill" style="width:${r}%"></div></div>
                        <span class="bar-val">${v.d}/${v.t} (${r}%)</span>
                      </div>`;
            }).join('')}
          </div>`;
      }

      // 8) 인사이트
      const insights = buildInsights(s);
      if (insights.length > 0) {
        html += `
          <div class="stats-section">
            <h3>&#128172; 새록 인사이트</h3>
            ${insights.map(([ico, msg]) => `
              <div class="insight-item"><span class="ico">${ico}</span><span>${msg}</span></div>`).join('')}
          </div>`;
      }

      body.innerHTML = html;
    }

    // ==========================================
    // Settings - API Connection
    // ==========================================
    function saveApiUrl() {
      const url = document.getElementById('apiUrlInput').value.trim();
      if (url) {
        localStorage.setItem(API_URL_KEY, url);
        showToast('URL 저장됨');
        updateConnectionStatus();
      } else {
        localStorage.removeItem(API_URL_KEY);
        showToast('URL 제거됨');
        updateConnectionStatus();
      }
    }

    async function testConnection() {
      const url = getApiUrl();
      if (!url) {
        showToast('URL을 먼저 입력하세요');
        return;
      }

      showLoading(true);
      const data = await apiGet('ping');
      showLoading(false);

      if (data && !data.error) {
        showToast('연결 성공!');
        updateConnectionStatus(true);
      } else {
        showToast('연결 실패 - URL을 확인하세요');
        updateConnectionStatus(false);
      }
    }

    function updateConnectionStatus(connected) {
      const badge = document.getElementById('connectionStatus');
      const hasUrl = !!getApiUrl();

      if (connected === true) {
        badge.textContent = '연결됨';
        badge.className = 'status-badge connected';
      } else if (connected === false || !hasUrl) {
        badge.textContent = hasUrl ? '연결 실패' : '미연결';
        badge.className = 'status-badge disconnected';
      }
    }

    // ==========================================
    // Toast
    // ==========================================
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
